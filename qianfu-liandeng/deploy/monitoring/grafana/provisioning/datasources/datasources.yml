# ============================================
# Grafana Datasource 自动化配置
# ==========================================

apiVersion: 1

datasources:
  # ==========================================
  # Prometheus 数据源
  # ==========================================
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      httpMethod: POST
      timeInterval: 15s
      prometheusType: Prometheus
      prometheusVersion: 2.48.0
      # 告警配置
      manageAlerts: true
      alertmanagerUid: alertmanager
      # 缓存配置
      httpCacheMaxAge: 600
      httpCacheResponseDataTTL: 60
    # 认证 (按需启用)
    # secureJsonData:
    #   httpHeaderValue1: Bearer ${PROMETHEUS_API_TOKEN}

  # ==========================================
  # Alertmanager 数据源
  # ==========================================
  - name: Alertmanager
    type: alertmanager
    uid: alertmanager
    access: proxy
    url: http://alertmanager:9093
    editable: false
    jsonData:
      httpMethod: GET
      # 渲染配置
      handleGrafanaManagedAlerts: true
      directions: asc
      customEndpoint: ''
      disable RESOLVE action: false

  # ==========================================
  # PostgreSQL 数据源 (可选)
  # ==========================================
  # - name: PostgreSQL
  #   type: postgres
  #   uid: postgres
  #   access: proxy
  #   url: postgres:5432
  #   database: postgres
  #   user: ${POSTGRES_USER:-postgres}
  #   editable: false
  #   jsonData:
  #     sslmode: disable
  #     postgresVersion: 150
  #     timescaledb: false
