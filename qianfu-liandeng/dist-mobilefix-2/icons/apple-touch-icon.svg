<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 180 180">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- iOS 图标背景（圆角矩形） -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradient)"/>

  <!-- 中心方块（Minecraft 风格） -->
  <g transform="translate(90, 90)">
    <!-- 主体方块 -->
    <rect x="-35" y="-35" width="70" height="70" fill="#fbbf24" rx="6"/>

    <!-- 方块高光 -->
    <rect x="-28" y="-28" width="24" height="24" fill="#fcd34d" rx="3"/>
    <rect x="-4" y="-28" width="28" height="12" fill="#fcd34d" rx="2"/>

    <!-- 方块阴影 -->
    <rect x="-28" y="8" width="56" height="24" fill="#d97706" rx="3"/>
    <rect x="6" y="-28" width="24" height="56" fill="#d97706" rx="3"/>

    <!-- 中心装饰 -->
    <circle cx="0" cy="0" r="12" fill="#6366f1"/>
    <circle cx="0" cy="0" r="8" fill="#8b5cf6"/>
    <circle cx="0" cy="0" r="4" fill="#ffffff"/>
  </g>
</svg>
