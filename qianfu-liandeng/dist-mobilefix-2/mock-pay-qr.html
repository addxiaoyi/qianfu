<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>支付二维码（开发模式）</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f8fb;
        --card: #ffffff;
        --text: #1f2937;
        --muted: #6b7280;
        --wechat: #10b981;
        --alipay: #2563eb;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top left, #eef4ff, var(--bg));
        font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
        color: var(--text);
      }
      .card {
        width: min(92vw, 420px);
        background: var(--card);
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        box-shadow: 0 24px 48px rgba(31, 41, 55, 0.1);
        padding: 24px;
      }
      .title {
        margin: 0 0 8px;
        font-size: 20px;
        line-height: 1.3;
      }
      .desc {
        margin: 0 0 16px;
        color: var(--muted);
        font-size: 14px;
      }
      .qr {
        width: 240px;
        height: 240px;
        margin: 8px auto 16px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: #fff;
        font-weight: 700;
        font-size: 20px;
        letter-spacing: 0.5px;
      }
      .qr.wechat {
        background: linear-gradient(145deg, #34d399, var(--wechat));
      }
      .qr.alipay {
        background: linear-gradient(145deg, #60a5fa, var(--alipay));
      }
      .meta {
        font-size: 13px;
        color: var(--muted);
        line-height: 1.7;
        word-break: break-word;
      }
      code {
        background: #f3f4f6;
        border-radius: 6px;
        padding: 2px 6px;
        color: #111827;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1 class="title">开发模式二维码</h1>
      <p class="desc">用于本地联调支付流程。生产环境请关闭 DEV mock 并接入真实 PayPro 回调。</p>
      <div id="qr" class="qr">QR</div>
      <div class="meta">
        <div>订单号：<code id="orderId">-</code></div>
        <div>金额：<code id="amount">-</code> CNY</div>
        <div>通道：<code id="method">-</code></div>
      </div>
    </main>
    <script>
      const params = new URLSearchParams(window.location.search);
      const orderId = params.get('orderId') || 'unknown';
      const amount = params.get('amount') || '0.00';
      const method = params.get('method') || 'wechat';
      const label = method === 'alipay' ? '支付宝' : '微信';
      const qr = document.getElementById('qr');
      qr.textContent = label;
      qr.classList.add(method === 'alipay' ? 'alipay' : 'wechat');
      document.getElementById('orderId').textContent = orderId;
      document.getElementById('amount').textContent = amount;
      document.getElementById('method').textContent = method;
    </script>
  </body>
</html>
