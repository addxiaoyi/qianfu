<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
  </defs>

  <!-- 背景（填满整个区域以适应 maskable 图标） -->
  <rect width="512" height="512" fill="url(#bgGradient)"/>

  <!-- 中心方块（Minecraft 风格）- 缩小以适应安全区域 -->
  <g transform="translate(256, 256)">
    <!-- 主体方块 -->
    <rect x="-80" y="-80" width="160" height="160" fill="#fbbf24" rx="12"/>

    <!-- 方块高光 -->
    <rect x="-65" y="-65" width="55" height="55" fill="#fcd34d" rx="6"/>
    <rect x="-10" y="-65" width="65" height="25" fill="#fcd34d" rx="3"/>

    <!-- 方块阴影 -->
    <rect x="-65" y="15" width="130" height="55" fill="#d97706" rx="6"/>
    <rect x="15" y="-65" width="55" height="130" fill="#d97706" rx="6"/>

    <!-- 中心装饰 -->
    <circle cx="0" cy="0" r="28" fill="#6366f1"/>
    <circle cx="0" cy="0" r="18" fill="#8b5cf6"/>
    <circle cx="0" cy="0" r="9" fill="#ffffff"/>
  </g>
</svg>
