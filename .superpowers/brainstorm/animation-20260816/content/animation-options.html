<style>
  .animation-options {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 18px;
    margin-top: 24px;
  }

  .animation-option {
    overflow: hidden;
    border: 1px solid #d9d9d9;
    border-radius: 14px;
    background: #fff;
    cursor: pointer;
    transition: border-color 180ms ease, transform 180ms ease, box-shadow 180ms ease;
  }

  .animation-option:hover {
    border-color: #171717;
    transform: translateY(-3px);
    box-shadow: 0 12px 28px rgba(0, 0, 0, .08);
  }

  .animation-option[data-selected="true"] {
    border-color: #111;
    box-shadow: 0 0 0 3px #111;
  }

  .animation-preview {
    position: relative;
    display: grid;
    min-height: 210px;
    place-items: center;
    overflow: hidden;
    background: #f4f4f2;
  }

  .preview-label {
    position: absolute;
    top: 12px;
    left: 14px;
    z-index: 2;
    color: #777;
    font: 600 11px/1.2 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .06em;
  }

  .lantern {
    width: 72px;
    height: 72px;
    background: #111;
    box-shadow: 12px 0 #5b5b5b, -12px 0 #5b5b5b, 0 12px #222, 0 -12px #222;
    transform: rotate(45deg);
  }

  .pixel-preview .lantern {
    animation: pixel-arrive 1s steps(5, end) infinite alternate;
  }

  @keyframes pixel-arrive {
    from { opacity: .12; transform: rotate(45deg) scale(.72); filter: blur(2px); }
    to { opacity: 1; transform: rotate(45deg) scale(1); filter: blur(0); }
  }

  .scan-preview {
    color: #f8f8f8;
    background: #111;
    font: 700 18px/1.3 ui-monospace, SFMono-Regular, Menlo, monospace;
  }

  .scan-preview::after {
    position: absolute;
    inset: 0;
    background: linear-gradient(transparent 48%, rgba(255, 255, 255, .22) 50%, transparent 52%);
    background-size: 100% 26px;
    content: '';
    animation: scan 1.2s linear infinite;
  }

  @keyframes scan {
    from { transform: translateY(-26px); }
    to { transform: translateY(26px); }
  }

  .scan-copy {
    position: relative;
    z-index: 1;
    padding: 14px;
    border: 1px solid #555;
    background: rgba(17, 17, 17, .8);
  }

  .fade-preview {
    background: #111;
  }

  .fade-preview .fade-mark {
    color: #fff;
    font: 800 28px/1 ui-sans-serif, system-ui, sans-serif;
    letter-spacing: -.06em;
    animation: fade-arrive 1.1s ease-in-out infinite alternate;
  }

  .fade-preview .fade-subtitle {
    margin-top: 12px;
    color: #aaa;
    font: 500 10px/1 ui-monospace, SFMono-Regular, Menlo, monospace;
    letter-spacing: .16em;
    text-align: center;
  }

  @keyframes fade-arrive {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .animation-copy {
    padding: 16px 18px 18px;
  }

  .animation-copy h3 {
    margin: 0 0 7px;
    font-size: 17px;
  }

  .animation-copy p {
    margin: 0;
    color: #666;
    font-size: 13px;
    line-height: 1.6;
  }

  @media (max-width: 820px) {
    .animation-options { grid-template-columns: 1fr; }
  }
</style>

<h2>全站首次打开：选择入场节奏</h2>
<p class="subtitle">3 个方向都可以用 Remotion Composition 固化时间轴；正式实现会只播放一次，并支持跳过。</p>

<div class="animation-options" data-multiselect>
  <div class="animation-option" data-choice="pixel-lantern" onclick="toggleSelect(this)">
    <div class="animation-preview pixel-preview">
      <span class="preview-label">A / 0.9s</span>
      <div class="lantern" aria-hidden="true"></div>
    </div>
    <div class="animation-copy">
      <h3>像素灯点亮</h3>
      <p>像素块逐步聚合成灯笼标志，最贴合千服联灯品牌，辨识度最高。</p>
    </div>
  </div>

  <div class="animation-option" data-choice="terminal-scan" onclick="toggleSelect(this)">
    <div class="animation-preview scan-preview">
      <span class="preview-label">B / 1.1s</span>
      <div class="scan-copy">QIANFU<br>LIANDENG<span aria-hidden="true">_</span></div>
    </div>
    <div class="animation-copy">
      <h3>终端扫描</h3>
      <p>黑底扫描线和终端字样快速建立“节点已连接”的产品感，气质更硬朗。</p>
    </div>
  </div>

  <div class="animation-option" data-choice="minimal-fade" onclick="toggleSelect(this)">
    <div class="animation-preview fade-preview">
      <span class="preview-label">C / 0.7s</span>
      <div>
        <div class="fade-mark">千服联灯</div>
        <div class="fade-subtitle">MINECRAFT NETWORK</div>
      </div>
    </div>
    <div class="animation-copy">
      <h3>极简淡入</h3>
      <p>标志和站点名称轻微上移淡入，最安静、性能开销最低，适合高频回访。</p>
    </div>
  </div>
</div>
