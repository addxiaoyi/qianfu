<!DOCTYPE html>
<html lang="zh-CN" data-accent="violet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千服联灯 - 登录</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/theme.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fafafa;
            color: #18181b;
            -webkit-font-smoothing: antialiased;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .login-container {
            width: 100%;
            max-width: 420px;
            padding: 24px;
        }
        
        .login-card {
            background: #ffffff;
            border-radius: 24px;
            border: 1px solid #f1f1f4;
            padding: 48px 40px;
            box-shadow: 0 4px 24px rgba(0,0,0,0.06);
        }
        
        .login-header {
            text-align: center;
            margin-bottom: 40px;
        }
        
        .login-logo {
            width: 64px;
            height: 64px;
            background: linear-gradient(135deg, var(--ui-accent), var(--ui-accent-medium));
            border-radius: 18px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 28px;
            font-weight: 900;
            font-style: italic;
            box-shadow: 0 12px 32px var(--ui-accent-shadow);
            margin-bottom: 20px;
        }
        
        .login-title {
            font-size: 20px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #18181b;
            font-style: italic;
        }
        
        .login-subtitle {
            font-size: 12px;
            font-weight: 600;
            color: #a1a1aa;
            margin-top: 6px;
            text-transform: uppercase;
            letter-spacing: 0.15em;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        .form-label {
            display: block;
            font-size: 11px;
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #52525b;
            margin-bottom: 8px;
        }
        
        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: #ffffff;
            border: 1px solid #e4e4e7;
            border-radius: 14px;
            font-size: 14px;
            color: #18181b;
            transition: all 0.2s;
            font-family: inherit;
        }
        
        .form-input:focus {
            outline: none;
            border-color: var(--ui-accent);
            box-shadow: 0 0 0 3px var(--ui-accent-ring);
        }
        
        .form-input::placeholder {
            color: #a1a1aa;
        }
        
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 14px 28px;
            border-radius: 14px;
            font-weight: 700;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            font-family: inherit;
            width: 100%;
        }
        
        .btn-accent {
            background-color: var(--ui-accent);
            color: white;
            box-shadow: 0 8px 24px var(--ui-accent-shadow);
        }
        
        .btn-accent:hover {
            filter: brightness(1.08);
            box-shadow: 0 14px 36px var(--ui-accent-shadow);
            transform: translateY(-2px);
        }
        
        .btn-accent:active {
            transform: scale(0.98);
        }
        
        .error-msg {
            background: #fef2f2;
            color: #dc2626;
            border: 1px solid #fecaca;
            border-radius: 12px;
            padding: 12px 16px;
            font-size: 13px;
            font-weight: 600;
            margin-bottom: 20px;
            display: none;
        }
        
        .error-msg.show {
            display: block;
        }
        
        .back-link {
            text-align: center;
            margin-top: 24px;
        }
        
        .back-link a {
            color: #a1a1aa;
            text-decoration: none;
            font-size: 12px;
            font-weight: 600;
            transition: color 0.3s;
        }
        
        .back-link a:hover {
            color: var(--ui-accent);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo">千</div>
                <h1 class="login-title">千服联灯</h1>
                <p class="login-subtitle">后台管理登录</p>
            </div>
            
            <div id="error-msg" class="error-msg"></div>
            
            <form id="login-form" onsubmit="handleLogin(event)">
                <div class="form-group">
                    <label class="form-label">访问密码</label>
                    <input type="password" id="password" class="form-input" placeholder="请输入管理密码" required autofocus>
                </div>
                
                <button type="submit" class="btn btn-accent" id="login-btn">
                    <i data-lucide="log-in"></i>
                    进入后台
                </button>
            </form>
            
            <div class="back-link">
                <a href="../index.html">← 返回主站</a>
            </div>
        </div>
    </div>
    
    <script>
        async function handleLogin(e) {
            e.preventDefault();
            
            const password = document.getElementById('password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const loginBtn = document.getElementById('login-btn');
            
            errorMsg.classList.remove('show');
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span>验证中...</span>';
            
            try {
                const response = await fetch('login.php?action=verify', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ password })
                });
                
                const data = await response.json();
                
                if (data.success) {
                    window.location.href = 'panel.html';
                } else {
                    errorMsg.textContent = data.error || '密码错误';
                    errorMsg.classList.add('show');
                    loginBtn.disabled = false;
                    loginBtn.innerHTML = '<i data-lucide="log-in"></i> 进入后台';
                    lucide.createIcons();
                }
            } catch (err) {
                errorMsg.textContent = '网络错误，请重试';
                errorMsg.classList.add('show');
                loginBtn.disabled = false;
                loginBtn.innerHTML = '<i data-lucide="log-in"></i> 进入后台';
                lucide.createIcons();
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });
    </script>
</body>
</html>
