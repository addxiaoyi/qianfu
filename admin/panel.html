<!DOCTYPE html>
<html lang="zh-CN" data-accent="violet">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>千服联灯 - 管理后台</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <!-- Styles -->
    <link rel="stylesheet" href="css/theme.css">
    <link rel="stylesheet" href="css/panel.css">
</head>
<body>
    <div class="layout">
        <!-- Mobile Overlay -->
        <div class="sidebar-overlay" id="sidebar-overlay" onclick="App.toggleMobileMenu(false)"></div>
        
        <!-- Mobile Header -->
        <header class="mobile-header">
            <div class="mobile-header-logo">
                <div class="mobile-header-logo-icon">千</div>
                <span class="mobile-header-title">千服联灯</span>
            </div>
            <button class="mobile-menu-btn" onclick="App.toggleMobileMenu(true)" aria-label="打开菜单">
                <i data-lucide="menu"></i>
            </button>
        </header>
        
        <!-- Sidebar (由 JS 动态渲染) -->
        <aside class="sidebar" id="sidebar"></aside>
        
        <!-- Main Content -->
        <main class="main">
            <div class="main-bg-text" id="bg-text">站点信息</div>
            
            <div class="content">
                <!-- Save Indicator -->
                <div id="save-indicator" class="save-indicator" style="display:none;">
                    <span>⏳</span>
                    <span>正在保存...</span>
                </div>
                
                <!-- Page Content -->
                <div id="page-content">
                    <!-- Loaded by JS -->
                </div>
            </div>
        </main>
    </div>
    
    <!-- Scripts -->
    <script src="js/api.js"></script>
    <script src="js/store.js"></script>
    <script src="js/components.js"></script>
    <script src="js/validator.js"></script>
    <script src="js/pages/site-info.js"></script>
    <script src="js/pages/server.js"></script>
    <script src="js/pages/team.js"></script>
    <script src="js/pages/content.js"></script>
    <script src="js/pages/style.js"></script>
    <script src="js/pages/social.js"></script>
    <script src="js/pages/backup.js"></script>
    <script src="js/pages/logs.js"></script>
    <script src="js/app.js"></script>
    
    <script>
        // Initialize app when DOM is ready
        document.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
