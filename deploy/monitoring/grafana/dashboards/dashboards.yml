# ============================================
# Grafana Dashboard Provisioning
# ============================================
apiVersion: 1

providers:
  - name: 'Prometheus Dashboards'
    orgId: 1
    folder: 'Prometheus'
    folderUid: 'prometheus'
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: true
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: true
