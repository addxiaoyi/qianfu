# 服务端口
server.port=${XPAY_PORT:8888}

# 数据库配置
spring.datasource.url=${XPAY_DB_URL:jdbc:mysql://127.0.0.1:3306/xpay?characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true}
spring.datasource.username=${XPAY_DB_USERNAME:root}
spring.datasource.password=${XPAY_DB_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Druid连接池配置 (Spring Boot 2.x)
spring.datasource.druid.initial-size=5
spring.datasource.druid.min-idle=5
spring.datasource.druid.max-active=20
spring.datasource.druid.max-wait=60000
spring.datasource.druid.time-between-eviction-runs-millis=60000
spring.datasource.druid.min-evictable-idle-time-millis=300000
spring.datasource.druid.validation-query=SELECT 1
spring.datasource.druid.test-while-idle=true
spring.datasource.druid.test-on-borrow=false
spring.datasource.druid.test-on-return=false
spring.datasource.druid.pool-prepared-statements=true
spring.datasource.druid.max-pool-prepared-statement-per-connection-size=20
spring.datasource.druid.filters=stat,wall
spring.datasource.druid.connection-properties=druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000

# JPA配置
spring.jpa.generate-ddl=true
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# Redis配置 (Spring Boot 2.x)
spring.redis.database=1
spring.redis.host=${XPAY_REDIS_HOST:127.0.0.1}
spring.redis.port=${XPAY_REDIS_PORT:6379}
spring.redis.password=
spring.redis.timeout=10000
spring.redis.lettuce.pool.max-active=50
spring.redis.lettuce.pool.max-wait=3000
spring.redis.lettuce.pool.max-idle=8
spring.redis.lettuce.pool.min-idle=2

# Thymeleaf模版
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# 日志
logging.level.root=INFO
logging.level.cn.exrick=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Spring Boot 2.x Actuator
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# JavaMailSender 邮件发送配置
spring.mail.host=${XPAY_SMTP_HOST:smtp.qq.com}
spring.mail.port=${XPAY_SMTP_PORT:25}
spring.mail.username=${XPAY_SMTP_USERNAME:}
spring.mail.password=${XPAY_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true

# 发送者邮箱账号
email.sender=${XPAY_EMAIL_SENDER:}
# 管理员接收者邮箱账号
email.receiver=${XPAY_EMAIL_RECEIVER:}

# 管理员链接有效时间(天)
token.admin.expire=14

# 假管理员key前缀
fake.pre=FAKE-

# 假管理员链接有效时间(小时)
token.fake.expire=1

# 服务器前部分域名 邮件中链接使用
server.url=${XPAY_PUBLIC_URL:http://127.0.0.1:8888}

# 防炸库缓存验证(分钟)
ip.expire=2

# 二次加密
my.token=${XPAY_TOKEN:}

# 管理后台 JWT
jwt.secret=${XPAY_ADMIN_JWT_SECRET:change-this-admin-jwt-secret}
jwt.expiration=${XPAY_ADMIN_JWT_EXPIRATION:86400}
xpay.secret.encryption-key=${XPAY_SECRET_ENCRYPTION_KEY:${jwt.secret}}
xpay.gateway.notify-secret=${XPAY_GATEWAY_NOTIFY_SECRET:${qianfu.secret-key}}

# 厂商回调适配层校验配置
xpay.provider.alipay.enabled=${XPAY_PROVIDER_ALIPAY_ENABLED:false}
xpay.provider.alipay.app-id=${XPAY_PROVIDER_ALIPAY_APP_ID:}
xpay.provider.alipay.private-key=${XPAY_PROVIDER_ALIPAY_PRIVATE_KEY:}
xpay.provider.alipay.verify-enabled=${XPAY_PROVIDER_ALIPAY_VERIFY_ENABLED:false}
xpay.provider.alipay.public-key=${XPAY_PROVIDER_ALIPAY_PUBLIC_KEY:}
xpay.provider.alipay.gateway-url=${XPAY_PROVIDER_ALIPAY_GATEWAY_URL:https://openapi.alipay.com/gateway.do}
xpay.provider.alipay.charset=${XPAY_PROVIDER_ALIPAY_CHARSET:UTF-8}
xpay.provider.alipay.sign-type=${XPAY_PROVIDER_ALIPAY_SIGN_TYPE:RSA2}
xpay.provider.wechat.enabled=${XPAY_PROVIDER_WECHAT_ENABLED:false}
xpay.provider.wechat.verify-enabled=${XPAY_PROVIDER_WECHAT_VERIFY_ENABLED:false}
xpay.provider.wechat.api-key=${XPAY_PROVIDER_WECHAT_API_KEY:}
xpay.provider.wechat.mch-id=${XPAY_PROVIDER_WECHAT_MCH_ID:}
xpay.provider.wechat.app-id=${XPAY_PROVIDER_WECHAT_APP_ID:}
xpay.provider.wechat.unified-order-url=${XPAY_PROVIDER_WECHAT_UNIFIED_ORDER_URL:https://api.mch.weixin.qq.com/pay/unifiedorder}
xpay.provider.wechat.spbill-create-ip=${XPAY_PROVIDER_WECHAT_SPBILL_CREATE_IP:127.0.0.1}

# 本地超级管理员引导
xpay.local-admin.enabled=${XPAY_LOCAL_ADMIN_ENABLED:true}
xpay.local-admin.bootstrap-username=${XPAY_SUPERADMIN_BOOTSTRAP_USERNAME:}
xpay.local-admin.bootstrap-password=${XPAY_SUPERADMIN_BOOTSTRAP_PASSWORD:}

# 单个固定收款码共几张
qrnum=${XPAY_QR_NUM:5}

# ========== 千服集成配置 ==========
qianfu.enabled=${QIANFU_ENABLED:true}
qianfu.app-id=${QIANFU_APP_ID:xpay-default}
qianfu.secret-key=${QIANFU_SECRET_KEY:change-me}
qianfu.api-url=${QIANFU_API_URL:http://127.0.0.1:3001/qianfu-api}
qianfu.callback-url=${QIANFU_CALLBACK_URL:http://127.0.0.1:3001/api/qianfu/xpay/notify}
qianfu.sign-algorithm=${QIANFU_SIGN_ALGORITHM:HmacSHA256}
qianfu.timeout=${QIANFU_TIMEOUT:30000}
qianfu.retry-count=${QIANFU_RETRY_COUNT:3}
