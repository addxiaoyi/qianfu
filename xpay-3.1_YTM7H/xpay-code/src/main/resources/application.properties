qianfu.enabled=true
qianfu.app-id=xpay-starmc-2024
qianfu.secret-key=a8f5f167f58447e16c4a8f5f167f5847
qianfu.api-url=http://121.196.161.249:8888/qianfu-api
qianfu.callback-url=http://121.196.161.249:8888/qianfu-api/notify
qianfu.sign-algorithm=HmacSHA256
