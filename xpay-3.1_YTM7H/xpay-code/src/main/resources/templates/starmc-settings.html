<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StarMC | 设置中心</title>
    <meta name="description" content="StarMC 支付网关设置 - 管理您的支付配置和账户信息">
    <link rel="icon" type="image/png" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/assets/css/ux-device/mobile.css" media="(max-width: 1023px)">
    <link rel="stylesheet" href="/assets/css/ux-device/desktop.css" media="(min-width: 1024px)">
    <script src="/assets/js/ux-device/core/device-detector.js"></script>
    <script src="/assets/js/ux-device/interactions/mobile/touch-interactions.js"></script>
    <script src="/assets/js/ux-device/interactions/desktop/mouse-interactions.js"></script>
    <script src="/assets/js/ux-device/performance/resource-optimizer.js"></script>
    <script src="/assets/js/ux-device/ux-system.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['Playfair Display', 'serif'],
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        'luxury': {
                            900: '#0a0a0f',
                            800: '#12121a',
                            700: '#1a1a25',
                            600: '#252536',
                            500: '#36364a',
                        },
                        'gold': {
                            50: '#fdf9f0',
                            100: '#f9f0db',
                            200: '#f2e0b6',
                            300: '#e8c984',
                            400: '#d4a853',
                            500: '#b8923e',
                            600: '#9a7630',
                            700: '#7c5d29',
                            800: '#654d27',
                            900: '#533f22',
                        },
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #1a1a25 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-panel {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .glass-panel-hover {
            transition: all 0.3s ease;
        }

        .glass-panel-hover:hover {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.12) 0%, rgba(255, 255, 255, 0.04) 100%);
            border-color: rgba(184, 146, 62, 0.3);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6), 0 0 30px rgba(184, 146, 62, 0.15), inset 0 1px 0 rgba(255, 255, 255, 0.15);
        }

        .input-luxury {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            transition: all 0.3s ease;
        }

        .input-luxury:focus {
            background: rgba(255, 255, 255, 0.08);
            border-color: rgba(184, 146, 62, 0.5);
            box-shadow: 0 0 20px rgba(184, 146, 62, 0.1);
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, #b8923e 0%, #d4a853 50%, #b8923e 100%);
            background-size: 200% 200%;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -10px rgba(184, 146, 62, 0.5);
        }

        .nav-item {
            transition: all 0.3s ease;
        }

        .nav-item:hover {
            background: rgba(255, 255, 255, 0.05);
        }

        .nav-item.active {
            background: linear-gradient(135deg, rgba(184, 146, 62, 0.2) 0%, rgba(184, 146, 62, 0.05) 100%);
            border-color: rgba(184, 146, 62, 0.4);
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.4;
        }

        @media (max-width: 768px) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                -webkit-text-size-adjust: 100%;
            }

            header {
                border-radius: 1rem !important;
                margin: 0.5rem !important;
                padding: 0.75rem 1rem !important;
            }

            main {
                padding: 1rem !important;
            }

            .glass-panel {
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }

            input, select, textarea {
                font-size: 16px !important;
            }

            main {
                padding-bottom: 5rem !important;
            }
        }
    </style>
</head>
<body class="antialiased text-white">
    <div class="orb w-96 h-96 -top-20 -left-20 animate-float" style="background: radial-gradient(circle, rgba(184, 146, 62, 0.6) 0%, transparent 70%); animation-delay: 0s;"></div>
    <div class="orb w-80 h-80 bottom-0 right-0 animate-float" style="background: radial-gradient(circle, rgba(139, 124, 247, 0.5) 0%, transparent 70%); animation-delay: 3s;"></div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <header class="glass-panel sticky top-6 mx-6 mt-6 rounded-2xl px-8 py-5">
            <div class="flex items-center justify-between max-w-7xl mx-auto">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center shadow-lg shadow-gold-500/20">
                        <i data-lucide="crown" class="w-7 h-7 text-luxury-900"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-display font-bold text-white tracking-wide">StarMC</h1>
                        <p class="text-xs text-white/50 tracking-widest uppercase">Settings Center</p>
                    </div>
                </div>

                <nav class="hidden md:flex items-center gap-8">
                    <a href="/starmc-pay.html" class="text-white/60 hover:text-gold-400 transition-colors text-sm font-medium tracking-wide">支付</a>
                    <a href="/starmc-confirm.html" class="text-white/60 hover:text-gold-400 transition-colors text-sm font-medium tracking-wide">记录</a>
                    <a href="/starmc-settings.html" class="text-gold-400 transition-colors text-sm font-medium tracking-wide">设置</a>
                </nav>
            </div>
        </header>

        <main class="flex-1 p-6 md:p-12">
            <div class="max-w-6xl mx-auto">
                <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">
                    <div class="lg:col-span-1">
                        <div class="glass-panel rounded-2xl p-4 space-y-2">
                            <a href="#general" class="nav-item active flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent">
                                <i data-lucide="settings" class="w-5 h-5 text-gold-400"></i>
                                <span class="text-sm font-medium">通用设置</span>
                            </a>
                            <a href="#payment" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent">
                                <i data-lucide="credit-card" class="w-5 h-5 text-white/60"></i>
                                <span class="text-sm font-medium">支付配置</span>
                            </a>
                            <a href="#notification" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent">
                                <i data-lucide="bell" class="w-5 h-5 text-white/60"></i>
                                <span class="text-sm font-medium">通知设置</span>
                            </a>
                            <a href="#security" class="nav-item flex items-center gap-3 px-4 py-3 rounded-xl border border-transparent">
                                <i data-lucide="shield" class="w-5 h-5 text-white/60"></i>
                                <span class="text-sm font-medium">安全设置</span>
                            </a>
                        </div>
                    </div>

                    <div class="lg:col-span-3 space-y-6">
                        <section id="general" class="glass-panel rounded-2xl p-6">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-gold-400/20 to-gold-600/20 flex items-center justify-center">
                                    <i data-lucide="settings" class="w-6 h-6 text-gold-400"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-display font-bold text-white">通用设置</h2>
                                    <p class="text-sm text-white/50">管理您的基本配置信息</p>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div>
                                    <label class="block text-sm font-medium text-white/70 mb-2">站点名称</label>
                                    <input type="text" class="input-luxury w-full px-4 py-3 rounded-xl text-white" value="StarMC 支付网关" placeholder="请输入站点名称">
                                </div>
                                <div>
                                    <label class="block text-sm font-medium text-white/70 mb-2">站点描述</label>
                                    <textarea class="input-luxury w-full px-4 py-3 rounded-xl text-white h-24 resize-none" placeholder="请输入站点描述">安全、极速、优雅的支付处理服务</textarea>
                                </div>
                                <div class="flex items-center justify-between py-3">
                                    <div>
                                        <p class="text-white font-medium">维护模式</p>
                                        <p class="text-sm text-white/50">启用后站点将显示维护页面</p>
                                    </div>
                                    <button class="w-12 h-6 rounded-full bg-white/10 relative transition-colors" onclick="toggleSwitch(this)">
                                        <div class="w-4 h-4 rounded-full bg-white absolute top-1 left-1 transition-transform"></div>
                                    </button>
                                </div>
                            </div>
                        </section>

                        <section id="payment" class="glass-panel rounded-2xl p-6">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-blue-400/20 to-blue-600/20 flex items-center justify-center">
                                    <i data-lucide="credit-card" class="w-6 h-6 text-blue-400"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-display font-bold text-white">支付配置</h2>
                                    <p class="text-sm text-white/50">配置您的支付渠道参数</p>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div class="glass-panel rounded-xl p-4">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-lg bg-blue-500/20 flex items-center justify-center">
                                                <i data-lucide="qr-code" class="w-5 h-5 text-blue-400"></i>
                                            </div>
                                            <div>
                                                <p class="text-white font-medium">支付宝当面付</p>
                                                <p class="text-xs text-white/50">扫码支付接口</p>
                                            </div>
                                        </div>
                                        <button class="w-12 h-6 rounded-full bg-gold-400 relative">
                                            <div class="w-4 h-4 rounded-full bg-white absolute top-1 right-1"></div>
                                        </button>
                                    </div>
                                    <div class="space-y-3">
                                        <input type="text" class="input-luxury w-full px-4 py-2.5 rounded-lg text-white text-sm" placeholder="App ID">
                                        <input type="text" class="input-luxury w-full px-4 py-2.5 rounded-lg text-white text-sm" placeholder="商户私钥">
                                        <input type="text" class="input-luxury w-full px-4 py-2.5 rounded-lg text-white text-sm" placeholder="支付宝公钥">
                                    </div>
                                </div>

                                <div class="glass-panel rounded-xl p-4">
                                    <div class="flex items-center justify-between mb-4">
                                        <div class="flex items-center gap-3">
                                            <div class="w-10 h-10 rounded-lg bg-green-500/20 flex items-center justify-center">
                                                <i data-lucide="message-circle" class="w-5 h-5 text-green-400"></i>
                                            </div>
                                            <div>
                                                <p class="text-white font-medium">微信支付</p>
                                                <p class="text-xs text-white/50">官方支付接口</p>
                                            </div>
                                        </div>
                                        <button class="w-12 h-6 rounded-full bg-white/10 relative" onclick="toggleSwitch(this)">
                                            <div class="w-4 h-4 rounded-full bg-white absolute top-1 left-1 transition-transform"></div>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        </section>

                        <section id="notification" class="glass-panel rounded-2xl p-6">
                            <div class="flex items-center gap-4 mb-6">
                                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-purple-400/20 to-purple-600/20 flex items-center justify-center">
                                    <i data-lucide="bell" class="w-6 h-6 text-purple-400"></i>
                                </div>
                                <div>
                                    <h2 class="text-xl font-display font-bold text-white">通知设置</h2>
                                    <p class="text-sm text-white/50">配置邮件和消息通知</p>
                                </div>
                            </div>

                            <div class="space-y-4">
                                <div class="flex items-center justify-between py-3">
                                    <div>
                                        <p class="text-white font-medium">支付成功通知</p>
                                        <p class="text-sm text-white/50">支付完成后发送邮件通知</p>
                                    </div>
                                    <button class="w-12 h-6 rounded-full bg-gold-400 relative">
                                        <div class="w-4 h-4 rounded-full bg-white absolute top-1 right-1"></div>
                                    </button>
                                </div>
                                <div class="flex items-center justify-between py-3">
                                    <div>
                                        <p class="text-white font-medium">新订单提醒</p>
                                        <p class="text-sm text-white/50">有新订单时发送管理员通知</p>
                                    </div>
                                    <button class="w-12 h-6 rounded-full bg-white/10 relative" onclick="toggleSwitch(this)">
                                        <div class="w-4 h-4 rounded-full bg-white absolute top-1 left-1 transition-transform"></div>
                                    </button>
                                </div>
                            </div>
                        </section>

                        <div class="flex justify-end gap-4">
                            <button class="px-6 py-3 rounded-xl glass-panel text-white font-medium hover:bg-white/5 transition-all">
                                重置
                            </button>
                            <button class="btn-primary px-8 py-3 rounded-xl text-luxury-900 font-bold">
                                保存设置
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        </main>

        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-luxury-900/95 backdrop-blur-xl border-t border-white/10 z-40 pb-safe">
            <div class="flex items-center justify-around py-3">
                <a href="/starmc-pay.html" class="flex flex-col items-center gap-1 px-4 py-2 text-white/60 hover:text-gold-400">
                    <i data-lucide="credit-card" class="w-5 h-5"></i>
                    <span class="text-xs">支付</span>
                </a>
                <a href="/starmc-confirm.html" class="flex flex-col items-center gap-1 px-4 py-2 text-white/60 hover:text-gold-400">
                    <i data-lucide="list" class="w-5 h-5"></i>
                    <span class="text-xs">记录</span>
                </a>
                <a href="/starmc-settings.html" class="flex flex-col items-center gap-1 px-4 py-2 text-gold-400">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="text-xs">设置</span>
                </a>
            </div>
        </nav>

        <footer class="glass-panel mx-4 mb-4 rounded-2xl px-6 py-4 hidden md:block">
            <div class="max-w-7xl mx-auto flex flex-col md:flex-row items-center justify-between gap-4">
                <p class="text-white/50 text-sm">© 2026 StarMC 支付网关。保留所有权利。</p>
                <div class="flex items-center gap-6">
                    <a href="#" class="text-white/50 hover:text-white text-sm transition-colors">隐私政策</a>
                    <a href="#" class="text-white/50 hover:text-white text-sm transition-colors">服务条款</a>
                    <a href="#" class="text-white/50 hover:text-white text-sm transition-colors">联系支持</a>
                </div>
            </div>
        </footer>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
        });

        function toggleSwitch(btn) {
            const dot = btn.querySelector('div');
            const isActive = btn.classList.contains('bg-gold-400');
            
            if (isActive) {
                btn.classList.remove('bg-gold-400');
                btn.classList.add('bg-white/10');
                dot.style.transform = 'translateX(0)';
            } else {
                btn.classList.remove('bg-white/10');
                btn.classList.add('bg-gold-400');
                dot.style.transform = 'translateX(24px)';
            }
        }
    </script>
</body>
</html>
