<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置中心 - StarMC XPay</title>
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
</head>
<body class="liandeng-body">
    <div class="ld-shell">
        <div class="ld-page">
            <header class="ld-topbar">
                <div class="ld-brand">
                    <div class="ld-brand-mark">SM</div>
                    <div class="ld-brand-copy">
                        <h1>Settings Center</h1>
                        <div class="ld-kicker">StarMC Merchant Workspace</div>
                    </div>
                </div>
                <nav class="ld-nav">
                    <a href="/starmc-pay.html" class="ld-nav-link">支付</a>
                    <a href="/starmc-confirm.html" class="ld-nav-link">记录</a>
                    <a href="/starmc-settings.html" class="ld-nav-link is-active">设置</a>
                </nav>
            </header>

            <main class="ld-grid ld-grid-sidebar">
                <aside class="ld-card">
                    <div class="ld-sidebar">
                        <a href="#general" class="ld-side-link is-active">通用设置</a>
                        <a href="#payment" class="ld-side-link">支付配置</a>
                        <a href="#notification" class="ld-side-link">通知设置</a>
                        <a href="#security" class="ld-side-link">安全设置</a>
                    </div>
                </aside>

                <section style="display:flex; flex-direction:column; gap:24px;">
                    <section id="general" class="ld-card">
                        <p class="ld-kicker">General</p>
                        <h2 class="ld-card-title">通用设置</h2>
                        <div class="ld-grid" style="grid-template-columns: 1fr; margin-top: 20px;">
                            <label class="ld-field">
                                <span class="ld-label">站点名称</span>
                                <input type="text" class="ld-input" value="StarMC 支付网关" placeholder="请输入站点名称">
                            </label>
                            <label class="ld-field">
                                <span class="ld-label">站点描述</span>
                                <textarea class="ld-textarea" placeholder="请输入站点描述">安全、极速、优雅的支付处理服务</textarea>
                            </label>
                        </div>
                    </section>

                    <section id="payment" class="ld-card">
                        <p class="ld-kicker">Payment Channels</p>
                        <h2 class="ld-card-title">支付配置</h2>
                        <div class="ld-grid" style="grid-template-columns: repeat(2, minmax(0, 1fr)); margin-top: 20px;">
                            <div class="ld-panel">
                                <div style="display:flex; justify-content:space-between; gap: 12px; align-items:flex-start;">
                                    <div>
                                        <div style="font-weight:700;">支付宝当面付</div>
                                        <div class="ld-copy">扫码支付接口</div>
                                    </div>
                                    <div class="ld-chip is-success">启用中</div>
                                </div>
                                <div class="ld-grid" style="grid-template-columns: 1fr; margin-top:16px; gap: 10px;">
                                    <input type="text" class="ld-input" placeholder="App ID">
                                    <input type="text" class="ld-input" placeholder="商户私钥">
                                    <input type="text" class="ld-input" placeholder="支付宝公钥">
                                </div>
                            </div>
                            <div class="ld-panel">
                                <div style="display:flex; justify-content:space-between; gap: 12px; align-items:flex-start;">
                                    <div>
                                        <div style="font-weight:700;">微信支付</div>
                                        <div class="ld-copy">官方支付接口</div>
                                    </div>
                                    <div class="ld-chip">待配置</div>
                                </div>
                                <div class="ld-grid" style="grid-template-columns: 1fr; margin-top:16px; gap: 10px;">
                                    <input type="text" class="ld-input" placeholder="App ID">
                                    <input type="text" class="ld-input" placeholder="商户号">
                                    <input type="text" class="ld-input" placeholder="API Key">
                                </div>
                            </div>
                        </div>
                    </section>

                    <section id="notification" class="ld-card">
                        <p class="ld-kicker">Notifications</p>
                        <h2 class="ld-card-title">通知设置</h2>
                        <div class="ld-list" style="margin-top: 14px;">
                            <div class="ld-list-item">
                                <div>
                                    <div style="font-weight:700;">支付成功通知</div>
                                    <div class="ld-copy">支付完成后发送邮件通知。</div>
                                </div>
                                <div class="ld-chip is-success">已启用</div>
                            </div>
                            <div class="ld-list-item">
                                <div>
                                    <div style="font-weight:700;">新订单提醒</div>
                                    <div class="ld-copy">有新订单时发送管理员通知。</div>
                                </div>
                                <div class="ld-chip">可选</div>
                            </div>
                        </div>
                    </section>

                    <section id="security" class="ld-card">
                        <p class="ld-kicker">Security</p>
                        <h2 class="ld-card-title">安全设置</h2>
                        <div class="ld-grid" style="grid-template-columns: repeat(3, minmax(0, 1fr)); margin-top: 20px;">
                            <div class="ld-panel">
                                <div style="font-weight:700;">回调签名</div>
                                <div class="ld-copy">建议每个项目独立密钥。</div>
                            </div>
                            <div class="ld-panel">
                                <div style="font-weight:700;">租户隔离</div>
                                <div class="ld-copy">不同项目分离回调与支付方式。</div>
                            </div>
                            <div class="ld-panel">
                                <div style="font-weight:700;">令牌轮换</div>
                                <div class="ld-copy">后台用户令牌应定期轮换。</div>
                            </div>
                        </div>
                    </section>

                    <div style="display:flex; justify-content:flex-end; gap:12px;">
                        <button class="ld-button-secondary" type="button">重置</button>
                        <button class="ld-button" type="button">保存设置</button>
                    </div>
                </section>
            </main>
        </div>
    </div>
</body>
</html>
