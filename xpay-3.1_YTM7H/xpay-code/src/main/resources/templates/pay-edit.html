<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>支付订单编辑</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
</head>
<body class="liandeng-body">
    <div class="ld-shell">
        <div class="ld-page" style="max-width: 860px;">
            <section class="ld-card">
                <div style="margin-bottom: 20px;">
                    <div class="ld-chip" style="margin-bottom: 14px;">Edit Order</div>
                    <h1 class="ld-card-title">支付订单编辑</h1>
                </div>

                <form class="ld-grid" style="grid-template-columns: 1fr; gap: 14px;" onsubmit="return false;">
                    <input type="text" id="id" hidden>
                    <input type="text" id="testEmail" hidden>
                    <div id="fake" class="hidden ld-chip is-warning">抱歉！由于您是假管理，不具备所有字段更改权限</div>

                    <label class="ld-field"><span class="ld-label">用户昵称</span><input type="text" id="nickName" class="ld-input"></label>
                    <label class="ld-field"><span class="ld-label">捐赠金额</span><input type="text" id="money" class="ld-input"></label>
                    <label class="ld-field"><span class="ld-label">支付方式</span><input type="text" id="payType" class="ld-input"></label>
                    <label class="ld-field"><span class="ld-label">支付标识号</span><input type="text" id="payNum" class="ld-input" disabled></label>
                    <label class="ld-field"><span class="ld-label">移动端</span><input type="text" id="mobile" class="ld-input" disabled></label>
                    <label class="ld-field"><span class="ld-label">自定义金额</span><input type="text" id="custom" class="ld-input" disabled></label>
                    <label class="ld-field"><span class="ld-label">留言</span><input type="text" id="info" class="ld-input"></label>
                    <label class="ld-field"><span class="ld-label">通知邮箱</span><input type="text" id="email" class="ld-input"></label>
                    <label class="ld-field"><span class="ld-label">支付时间</span><input type="text" id="time" class="ld-input"></label>
                    <label class="ld-field"><span class="ld-label">状态</span><input type="text" id="state" class="ld-input" disabled></label>

                    <div style="margin-top: 10px;">
                        <button type="button" class="ld-button" onclick="confirmEdit()">确认修改</button>
                    </div>
                </form>
            </section>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script>
        function getUrlParam(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return unescape(r[2]);
            return null;
        }

        var id = getUrlParam('id');
        var token = getUrlParam('token');
        if(id && id.indexOf('FAKE') >= 0){
            $("#money").attr("disabled","disabled");
            $("#payType").attr("disabled","disabled");
            $("#state").attr("disabled","disabled");
            $("#fake").removeClass('hidden');
        }

        $.get('/pay/' + id, { token: token }, function (data) {
            if(data.success==true){
                $("#id").val(id);
                $("#testEmail").val(data.result.testEmail);
                $("#mobile").val(data.result.mobile);
                $("#custom").val(data.result.custom);
                $("#payNum").val(data.result.payNum);
                $("#nickName").val(data.result.nickName);
                $("#money").val(data.result.money);
                $("#info").val(data.result.info);
                $("#payType").val(data.result.payType);
                $("#time").val(data.result.time);
                $("#email").val(data.result.email);
                var state = data.result.state;
                if(state==0){ $("#state").val('待审核'); }
                else if(state==1){ $("#state").val('审核通过'); }
                else if(state==2){ $("#state").val('已驳回'); }
                else if(state==3){ $("#state").val('通过但不显示'); }
                else if(state==4){ $("#state").val('已扫码'); }
                else { $("#state").val('其他态'); }
            } else {
                alert(data.message);
            }
        });

        function confirmEdit() {
            if (window.confirm(id && id.indexOf('FAKE') >= 0 ? '确认提交修改？由于您是假管理提交成功后该链接将失效' : '确认提交修改？')) {
                submit();
            }
        }

        function submit(){
            $.post('/pay/edit', {
                id: id,
                token: token,
                testEmail: $("#testEmail").val(),
                payNum: $("#payNum").val(),
                mobile: $("#mobile").val(),
                custom: $("#custom").val(),
                nickName: $("#nickName").val(),
                money: $("#money").val(),
                info: $("#info").val(),
                payType: $("#payType").val(),
                time: $("#time").val(),
                email: $("#email").val()
            }, function (data) {
                if(data.success==true){
                    if(id && id.indexOf('FAKE')>=0){
                        window.location.href = "/success";
                        return;
                    }
                    alert('修改成功');
                    window.location.reload();
                } else {
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
