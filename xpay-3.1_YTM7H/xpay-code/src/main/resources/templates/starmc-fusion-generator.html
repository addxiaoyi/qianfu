<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>StarMC - 融合支付码生成器</title>
    <link rel="icon" type="image/png" href="favicon.ico">
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsqr@1.4.0/dist/jsQR.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.3/build/qrcode.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['Playfair Display', 'serif'],
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        gold: {
                            DEFAULT: '#b8923e',
                            light: '#d4a853',
                            dark: '#8a6d2f',
                        },
                        luxury: {
                            bg: '#0a0a0f',
                            card: '#12121a',
                            surface: '#1a1a25',
                        }
                    }
                }
            }
        }
    </script>

    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        body {
            font-family: "Geist", "Inter", system-ui, sans-serif;
            background: linear-gradient(180deg, #fbfbf8 0%, #f6f6f3 100%);
            min-height: 100vh;
            color: #111111;
        }

        .glass-luxury {
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(17,17,17,0.08);
            box-shadow: 0 16px 40px rgba(17,17,17,0.08);
        }

        .btn-luxury {
            background: #111111;
            background-size: auto;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-luxury:active {
            transform: scale(0.95);
            background-position: 100% 100%;
        }

        .upload-zone {
            border: 2px dashed rgba(17, 17, 17, 0.18);
            transition: all 0.3s ease;
        }

        .upload-zone:hover, .upload-zone.dragover {
            border-color: #111111;
            background: rgba(17, 17, 17, 0.04);
        }

        .payment-card {
            transition: all 0.3s ease;
        }

        .payment-card.has-data {
            border-color: #111111;
            background: rgba(17, 17, 17, 0.05);
        }

        .glow-gold {
            box-shadow: 0 16px 32px rgba(17, 17, 17, 0.08);
        }
    </style>
</head>
<body class="text-white">

    <div class="min-h-screen pb-20">
        <!-- Header -->
        <header class="sticky top-0 z-50 glass-luxury border-b border-white/10">
            <div class="max-w-lg mx-auto px-4 py-4 flex items-center justify-between">
                <button onclick="goBack()" class="p-2 rounded-xl hover:bg-white/10 transition-all">
                    <i data-lucide="arrow-left" class="w-6 h-6"></i>
                </button>
                <h1 class="font-display text-xl font-bold">融合支付码</h1>
                <div class="w-10"></div>
            </div>
        </header>

        <!-- Main Content -->
        <main class="max-w-lg mx-auto px-4 py-6 space-y-6">

            <!-- Description -->
            <div class="text-center mb-8">
                <p class="text-white/60 text-sm">上传多个支付收款码，生成一个融合二维码</p>
                <p class="text-white/40 text-xs mt-1">用户扫描后可选择支付方式</p>
            </div>

            <!-- Payment Method Cards -->
            <div class="space-y-4">
                <!-- Alipay -->
                <div id="alipayCard" class="payment-card glass-luxury rounded-2xl p-4 border border-white/10">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-blue-500/20 flex items-center justify-center">
                            <i data-lucide="store" class="w-6 h-6 text-blue-400"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-semibold">支付宝</h3>
                            <p id="alipayStatus" class="text-xs text-white/40">未上传</p>
                        </div>
                        <button onclick="uploadQR('alipay')" class="px-4 py-2 rounded-xl bg-white/10 text-sm hover:bg-white/20 transition-all">
                            上传
                        </button>
                    </div>
                    <input type="file" id="alipayInput" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'alipay')">
                </div>

                <!-- WeChat -->
                <div id="wechatCard" class="payment-card glass-luxury rounded-2xl p-4 border border-white/10">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-green-500/20 flex items-center justify-center">
                            <i data-lucide="message-circle" class="w-6 h-6 text-green-400"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-semibold">微信支付</h3>
                            <p id="wechatStatus" class="text-xs text-white/40">未上传</p>
                        </div>
                        <button onclick="uploadQR('wechat')" class="px-4 py-2 rounded-xl bg-white/10 text-sm hover:bg-white/20 transition-all">
                            上传
                        </button>
                    </div>
                    <input type="file" id="wechatInput" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'wechat')">
                </div>

                <!-- QQ -->
                <div id="qqCard" class="payment-card glass-luxury rounded-2xl p-4 border border-white/10">
                    <div class="flex items-center gap-4">
                        <div class="w-12 h-12 rounded-xl bg-yellow-500/20 flex items-center justify-center">
                            <i data-lucide="message-square" class="w-6 h-6 text-yellow-400"></i>
                        </div>
                        <div class="flex-1">
                            <h3 class="font-semibold">QQ支付</h3>
                            <p id="qqStatus" class="text-xs text-white/40">未上传</p>
                        </div>
                        <button onclick="uploadQR('qq')" class="px-4 py-2 rounded-xl bg-white/10 text-sm hover:bg-white/20 transition-all">
                            上传
                        </button>
                    </div>
                    <input type="file" id="qqInput" accept="image/*" class="hidden" onchange="handleFileSelect(event, 'qq')">
                </div>
            </div>

            <!-- Generate Button -->
            <button id="generateBtn" onclick="generateFusionQR()" class="btn-luxury w-full py-4 rounded-2xl text-luxury-bg font-bold text-lg mt-8 opacity-50 cursor-not-allowed" disabled>
                生成融合支付码
            </button>

            <!-- Result Section -->
            <div id="resultSection" class="hidden mt-8">
                <div class="glass-luxury rounded-2xl p-6 text-center">
                    <h3 class="font-display text-xl font-bold mb-4">融合支付码</h3>
                    <div class="bg-white p-4 rounded-xl inline-block mb-4">
                        <canvas id="fusionQRCode"></canvas>
                    </div>
                    <p class="text-white/60 text-sm mb-4">扫描上方二维码选择支付方式</p>
                    <div class="flex gap-3">
                        <button onclick="downloadQR()" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-sm">
                            下载二维码
                        </button>
                        <button onclick="copyLink()" class="flex-1 py-3 rounded-xl bg-white/10 hover:bg-white/20 transition-all text-sm">
                            复制链接
                        </button>
                    </div>
                </div>
            </div>

        </main>
    </div>

    <!-- Toast -->
    <div id="toast" class="fixed top-24 left-1/2 transform -translate-x-1/2 px-6 py-3 rounded-full z-50 text-white text-sm font-medium opacity-0 pointer-events-none transition-all" style="background: rgba(184, 146, 62, 0.9); backdrop-filter: blur(10px);">
        <span id="toastMessage">提示信息</span>
    </div>

    <script>
        // Data storage
        const paymentData = {
            alipay: null,
            wechat: null,
            qq: null
        };

        document.addEventListener('DOMContentLoaded', () => {
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }

            // Animate cards
            gsap.from('.payment-card', {
                y: 30,
                opacity: 0,
                duration: 0.5,
                stagger: 0.1,
                ease: "power2.out"
            });
        });

        function goBack() {
            window.location.href = '/starmc-settings.html';
        }

        function uploadQR(type) {
            document.getElementById(type + 'Input').click();
        }

        function handleFileSelect(event, type) {
            const file = event.target.files[0];
            if (!file) return;

            if (!file.type.startsWith('image/')) {
                showToast('请上传图片文件');
                return;
            }

            const reader = new FileReader();
            reader.onload = (e) => {
                const img = new Image();
                img.onload = () => {
                    parseQRCode(img, type);
                };
                img.src = e.target.result;
            };
            reader.readAsDataURL(file);
        }

        function parseQRCode(img, type) {
            const canvas = document.createElement('canvas');
            const context = canvas.getContext('2d');
            canvas.width = img.width;
            canvas.height = img.height;
            context.drawImage(img, 0, 0, img.width, img.height);

            const imageData = context.getImageData(0, 0, canvas.width, canvas.height);

            try {
                const code = jsQR(imageData.data, imageData.width, imageData.height);

                if (code) {
                    paymentData[type] = code.data;
                    updateCardStatus(type, true);
                    showToast(`${getTypeName(type)}二维码解析成功`);
                    checkCanGenerate();
                } else {
                    showToast('无法识别二维码，请上传清晰的收款码');
                }
            } catch (e) {
                showToast('二维码解析出错：' + e.message);
            }
        }

        function getTypeName(type) {
            const names = {
                alipay: '支付宝',
                wechat: '微信',
                qq: 'QQ'
            };
            return names[type] || type;
        }

        function updateCardStatus(type, hasData) {
            const card = document.getElementById(type + 'Card');
            const status = document.getElementById(type + 'Status');

            if (hasData) {
                card.classList.add('has-data');
                status.textContent = '已上传';
                status.classList.remove('text-white/40');
                status.classList.add('text-gold');
            }
        }

        function checkCanGenerate() {
            const hasAnyData = paymentData.alipay || paymentData.wechat || paymentData.qq;
            const btn = document.getElementById('generateBtn');

            if (hasAnyData) {
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }
        }

        function generateFusionQR() {
            const params = new URLSearchParams();
            if (paymentData.alipay) params.append('alipay', paymentData.alipay);
            if (paymentData.wechat) params.append('wechat', paymentData.wechat);
            if (paymentData.qq) params.append('qq', paymentData.qq);

            const fusionUrl = window.location.origin + '/starmc-fusion-pay.html?' + params.toString();

            // Generate QR Code
            const canvas = document.getElementById('fusionQRCode');
            QRCode.toCanvas(canvas, fusionUrl, {
                width: 200,
                margin: 2,
                color: {
                    dark: '#000000',
                    light: '#ffffff'
                }
            }, (error) => {
                if (error) {
                    showToast('生成二维码失败');
                    console.error(error);
                } else {
                    showResult();
                }
            });
        }

        function showResult() {
            const resultSection = document.getElementById('resultSection');
            resultSection.classList.remove('hidden');

            gsap.from(resultSection, {
                y: 30,
                opacity: 0,
                duration: 0.5,
                ease: "power2.out"
            });

            // Scroll to result
            setTimeout(() => {
                resultSection.scrollIntoView({ behavior: 'smooth', block: 'center' });
            }, 100);
        }

        function downloadQR() {
            const canvas = document.getElementById('fusionQRCode');
            const link = document.createElement('a');
            link.download = 'starmc-fusion-qr.png';
            link.href = canvas.toDataURL();
            link.click();
            showToast('二维码已下载');
        }

        function copyLink() {
            const params = new URLSearchParams();
            if (paymentData.alipay) params.append('alipay', paymentData.alipay);
            if (paymentData.wechat) params.append('wechat', paymentData.wechat);
            if (paymentData.qq) params.append('qq', paymentData.qq);

            const fusionUrl = window.location.origin + '/starmc-fusion-pay.html?' + params.toString();

            navigator.clipboard.writeText(fusionUrl).then(() => {
                showToast('链接已复制到剪贴板');
            }).catch(() => {
                showToast('复制失败，请手动复制');
            });
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMessage = document.getElementById('toastMessage');
            toastMessage.textContent = message;

            toast.classList.remove('opacity-0', 'pointer-events-none');
            toast.classList.add('opacity-100');

            setTimeout(() => {
                toast.classList.remove('opacity-100');
                toast.classList.add('opacity-0', 'pointer-events-none');
            }, 2500);
        }
    </script>

</body>
</html>
