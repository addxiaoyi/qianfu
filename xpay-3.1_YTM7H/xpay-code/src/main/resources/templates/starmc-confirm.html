<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>支付确认 - StarMC XPay</title>
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
</head>
<body class="liandeng-body">
    <div class="ld-shell">
        <div class="ld-page" style="max-width: 1080px;">
            <header class="ld-topbar">
                <div class="ld-brand">
                    <div class="ld-brand-mark">SM</div>
                    <div class="ld-brand-copy">
                        <h1>Order Status</h1>
                        <div class="ld-kicker">StarMC Payment Confirmation</div>
                    </div>
                </div>
                <nav class="ld-nav">
                    <a href="/starmc-pay.html" class="ld-nav-link">支付</a>
                    <a href="/starmc-confirm.html" class="ld-nav-link is-active">记录</a>
                    <a href="/starmc-settings.html" class="ld-nav-link">设置</a>
                </nav>
            </header>

            <main class="ld-grid" style="grid-template-columns: 1fr; max-width: 760px; margin: 0 auto;">
                <section class="ld-card" style="text-align:center;">
                    <div class="ld-chip is-warning" style="margin-bottom: 18px;">Order Created</div>
                    <h2 class="ld-card-title">订单已创建</h2>
                    <p class="ld-copy">请完成支付以确认您的订单。</p>

                    <div class="ld-panel" style="text-align:left; margin: 28px 0;">
                        <div class="ld-list">
                            <div class="ld-list-item">
                                <div style="font-weight:700;">订单编号</div>
                                <div id="orderId" class="ld-mono">ORD-2026-001</div>
                            </div>
                            <div class="ld-list-item">
                                <div style="font-weight:700;">支付金额</div>
                                <div style="font-weight:900; font-size:1.4rem;">¥<span id="orderAmount">100.00</span></div>
                            </div>
                            <div class="ld-list-item">
                                <div style="font-weight:700;">支付方式</div>
                                <div id="paymentMethod">支付宝当面付</div>
                            </div>
                            <div class="ld-list-item">
                                <div style="font-weight:700;">订单状态</div>
                                <div class="ld-chip is-warning">等待支付</div>
                            </div>
                        </div>
                    </div>

                    <div style="display:flex; flex-direction:column; gap:12px;">
                        <button onclick="checkPaymentStatus()" class="ld-button" type="button">查询支付状态</button>
                        <a href="/starmc-pay.html" class="ld-button-secondary">返回支付页面</a>
                    </div>
                </section>
            </main>
        </div>
    </div>

    <div id="loadingModal" class="ld-modal-backdrop" aria-hidden="true">
        <div class="ld-card" style="max-width: 360px; width: 100%; text-align:center;">
            <div class="ld-chip" style="margin-bottom: 14px;">Loading</div>
            <h3 class="ld-card-title" style="font-size:1.4rem;">查询中</h3>
            <p class="ld-copy">正在获取订单最新状态。</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadOrderInfo();
        });

        function loadOrderInfo() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId') || 'ORD-2026-001';
            const amount = urlParams.get('amount') || '100.00';
            const method = urlParams.get('method') || '支付宝当面付';

            document.getElementById('orderId').textContent = orderId;
            document.getElementById('orderAmount').textContent = amount;
            document.getElementById('paymentMethod').textContent = method;
        }

        function checkPaymentStatus() {
            const modal = document.getElementById('loadingModal');
            modal.setAttribute('aria-hidden', 'false');

            setTimeout(() => {
                modal.setAttribute('aria-hidden', 'true');
                showToast('支付状态查询完成');
            }, 2000);
        }

        function showToast(message) {
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-message ld-chip';
            toast.style.position = 'fixed';
            toast.style.top = '24px';
            toast.style.left = '50%';
            toast.style.transform = 'translateX(-50%)';
            toast.style.zIndex = '1000';
            toast.textContent = message;
            document.body.appendChild(toast);

            setTimeout(() => {
                toast.remove();
            }, 2500);
        }
    </script>
</body>
</html>
