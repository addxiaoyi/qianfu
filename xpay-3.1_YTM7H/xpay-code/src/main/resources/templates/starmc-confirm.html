<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0a0f">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>StarMC | 支付确认</title>
    <meta name="description" content="StarMC 支付确认 - 验证您的支付状态">
    <link rel="icon" type="image/png" href="favicon.ico">
    
    <script src="https://cdn.tailwindcss.com"></script>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <link rel="stylesheet" href="/assets/css/ux-device/mobile.css" media="(max-width: 1023px)">
    <link rel="stylesheet" href="/assets/css/ux-device/desktop.css" media="(min-width: 1024px)">
    <script src="/assets/js/ux-device/core/device-detector.js"></script>
    <script src="/assets/js/ux-device/interactions/mobile/touch-interactions.js"></script>
    <script src="/assets/js/ux-device/interactions/desktop/mouse-interactions.js"></script>
    <script src="/assets/js/ux-device/performance/resource-optimizer.js"></script>
    <script src="/assets/js/ux-device/ux-system.js"></script>
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['Playfair Display', 'serif'],
                        'sans': ['Plus Jakarta Sans', 'sans-serif'],
                    },
                    colors: {
                        'luxury': {
                            900: '#0a0a0f',
                            800: '#12121a',
                            700: '#1a1a25',
                            600: '#252536',
                            500: '#36364a',
                        },
                        'gold': {
                            50: '#fdf9f0',
                            100: '#f9f0db',
                            200: '#f2e0b6',
                            300: '#e8c984',
                            400: '#d4a853',
                            500: '#b8923e',
                            600: '#9a7630',
                            700: '#7c5d29',
                            800: '#654d27',
                            900: '#533f22',
                        },
                        'violet': {
                            400: '#a78bfa',
                            500: '#8b7cf7',
                            600: '#7c3aed',
                        }
                    },
                    animation: {
                        'float': 'float 8s ease-in-out infinite',
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0px)' },
                            '50%': { transform: 'translateY(-20px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background: linear-gradient(135deg, #0a0a0f 0%, #12121a 50%, #1a1a25 100%);
            background-size: 400% 400%;
            animation: gradientShift 20s ease infinite;
            min-height: 100vh;
            overflow-x: hidden;
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .glass-luxury {
            background: linear-gradient(135deg, rgba(255, 255, 255, 0.08) 0%, rgba(255, 255, 255, 0.02) 100%);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        .btn-luxury {
            background: linear-gradient(135deg, #b8923e 0%, #d4a853 50%, #b8923e 100%);
            background-size: 200% 200%;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn-luxury:hover {
            transform: translateY(-2px);
            box-shadow: 0 20px 40px -10px rgba(184, 146, 62, 0.5);
        }

        .status-badge {
            animation: pulse 2s ease-in-out infinite;
        }

        .orb {
            position: absolute;
            border-radius: 50%;
            filter: blur(80px);
            pointer-events: none;
            opacity: 0.4;
        }

        @media (max-width: 768px) {
            body {
                padding-top: env(safe-area-inset-top);
                padding-bottom: env(safe-area-inset-bottom);
                -webkit-text-size-adjust: 100%;
            }

            header {
                border-radius: 1rem !important;
                margin: 0.5rem !important;
                padding: 0.75rem 1rem !important;
            }

            main {
                padding: 1rem !important;
            }

            .glass-luxury {
                backdrop-filter: blur(16px);
                -webkit-backdrop-filter: blur(16px);
            }

            input, select, textarea {
                font-size: 16px !important;
            }

            main {
                padding-bottom: 5rem !important;
            }
        }
    </style>
</head>
<body class="antialiased text-white">
    <div class="orb w-96 h-96 -top-20 -left-20 animate-float" style="background: radial-gradient(circle, rgba(184, 146, 62, 0.6) 0%, transparent 70%); animation-delay: 0s;"></div>
    <div class="orb w-80 h-80 bottom-0 right-0 animate-float" style="background: radial-gradient(circle, rgba(139, 124, 247, 0.5) 0%, transparent 70%); animation-delay: 3s;"></div>

    <div class="relative z-10 min-h-screen flex flex-col">
        <header class="glass-luxury sticky top-6 mx-6 mt-6 rounded-2xl px-8 py-5">
            <div class="flex items-center justify-between max-w-7xl mx-auto">
                <div class="flex items-center gap-4">
                    <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-gold-400 to-gold-600 flex items-center justify-center shadow-lg shadow-gold-500/20">
                        <i data-lucide="crown" class="w-7 h-7 text-luxury-900"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-display font-bold text-white tracking-wide">StarMC</h1>
                        <p class="text-xs text-white/50 tracking-widest uppercase">Payment Confirmation</p>
                    </div>
                </div>

                <nav class="hidden md:flex items-center gap-8">
                    <a href="/starmc-pay.html" class="text-white/60 hover:text-gold-400 transition-colors text-sm font-medium tracking-wide">支付</a>
                    <a href="/starmc-confirm.html" class="text-gold-400 transition-colors text-sm font-medium tracking-wide">记录</a>
                    <a href="/starmc-settings.html" class="text-white/60 hover:text-gold-400 transition-colors text-sm font-medium tracking-wide">设置</a>
                </nav>
            </div>
        </header>

        <main class="flex-1 flex items-center justify-center p-6 md:p-12">
            <div class="w-full max-w-2xl">
                <div class="glass-luxury rounded-3xl p-8 md:p-12 text-center">
                    <div class="w-24 h-24 rounded-full bg-gradient-to-br from-gold-400/20 to-gold-600/20 flex items-center justify-center mx-auto mb-6 border border-gold-400/30">
                        <i data-lucide="check-circle" class="w-12 h-12 text-gold-400"></i>
                    </div>

                    <h2 class="text-3xl font-display font-bold text-white mb-3">订单已创建</h2>
                    <p class="text-white/50 mb-8">请完成支付以确认您的订单</p>

                    <div class="glass-luxury rounded-2xl p-6 mb-8 text-left">
                        <div class="flex items-center justify-between mb-4 pb-4 border-b border-white/10">
                            <span class="text-white/50">订单编号</span>
                            <span class="text-white font-mono" id="orderId">ORD-2026-001</span>
                        </div>
                        <div class="flex items-center justify-between mb-4 pb-4 border-b border-white/10">
                            <span class="text-white/50">支付金额</span>
                            <span class="text-2xl font-display font-bold text-gold-400">¥<span id="orderAmount">100.00</span></span>
                        </div>
                        <div class="flex items-center justify-between mb-4 pb-4 border-b border-white/10">
                            <span class="text-white/50">支付方式</span>
                            <span class="text-white flex items-center gap-2">
                                <i data-lucide="qr-code" class="w-4 h-4"></i>
                                <span id="paymentMethod">支付宝当面付</span>
                            </span>
                        </div>
                        <div class="flex items-center justify-between">
                            <span class="text-white/50">订单状态</span>
                            <span class="status-badge px-3 py-1 rounded-full bg-yellow-500/20 text-yellow-400 text-sm flex items-center gap-2">
                                <div class="w-2 h-2 rounded-full bg-yellow-400 animate-pulse"></div>
                                等待支付
                            </span>
                        </div>
                    </div>

                    <div class="space-y-4">
                        <button onclick="checkPaymentStatus()" class="btn-luxury w-full py-4 rounded-xl text-luxury-900 font-bold text-lg flex items-center justify-center gap-3">
                            <i data-lucide="refresh-cw" class="w-5 h-5"></i>
                            <span>查询支付状态</span>
                        </button>

                        <a href="/starmc-pay.html" class="block w-full py-4 rounded-xl glass-luxury text-white font-medium hover:bg-white/5 transition-all flex items-center justify-center gap-3">
                            <i data-lucide="arrow-left" class="w-5 h-5"></i>
                            <span>返回支付页面</span>
                        </a>
                    </div>

                    <div class="mt-8 pt-8 border-t border-white/10">
                        <p class="text-white/30 text-sm">支付遇到问题？请联系客服获取帮助</p>
                        <a href="#" class="text-gold-400 text-sm mt-2 inline-block hover:underline">联系支持</a>
                    </div>
                </div>

                <div class="text-center mt-8 hidden md:block">
                    <div class="flex items-center justify-center gap-6 text-white/40 text-xs mb-4">
                        <div class="flex items-center gap-2">
                            <i data-lucide="shield-check" class="w-4 h-4 text-violet-400"></i>
                            <span>安全支付</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="clock" class="w-4 h-4 text-gold-400"></i>
                            <span>24/7 专属支持</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <i data-lucide="lock" class="w-4 h-4 text-violet-400"></i>
                            <span>256位加密</span>
                        </div>
                    </div>
                    <p class="text-white/20 text-xs tracking-widest uppercase">© 2026 StarMC 支付网关 · 尊享版</p>
                </div>
            </div>
        </main>

        <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-luxury-900/95 backdrop-blur-xl border-t border-white/10 z-40 pb-safe">
            <div class="flex items-center justify-around py-3">
                <a href="/starmc-pay.html" class="flex flex-col items-center gap-1 px-4 py-2 text-white/60 hover:text-gold-400">
                    <i data-lucide="credit-card" class="w-5 h-5"></i>
                    <span class="text-xs">支付</span>
                </a>
                <a href="/starmc-confirm.html" class="flex flex-col items-center gap-1 px-4 py-2 text-gold-400">
                    <i data-lucide="list" class="w-5 h-5"></i>
                    <span class="text-xs">记录</span>
                </a>
                <a href="/starmc-settings.html" class="flex flex-col items-center gap-1 px-4 py-2 text-white/60 hover:text-gold-400">
                    <i data-lucide="settings" class="w-5 h-5"></i>
                    <span class="text-xs">设置</span>
                </a>
            </div>
        </nav>
    </div>

    <div id="loadingModal" class="fixed inset-0 bg-luxury-900/80 backdrop-blur-xl z-50 hidden items-center justify-center">
        <div class="glass-luxury rounded-3xl p-10 flex flex-col items-center gap-5">
            <div class="w-14 h-14 border-4 border-white/10 border-t-gold-400 rounded-full animate-spin"></div>
            <p class="text-white font-medium tracking-wide">查询中...</p>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            lucide.createIcons();
            loadOrderInfo();
        });

        function loadOrderInfo() {
            const urlParams = new URLSearchParams(window.location.search);
            const orderId = urlParams.get('orderId') || 'ORD-2026-001';
            const amount = urlParams.get('amount') || '100.00';
            const method = urlParams.get('method') || '支付宝当面付';

            document.getElementById('orderId').textContent = orderId;
            document.getElementById('orderAmount').textContent = amount;
            document.getElementById('paymentMethod').textContent = method;
        }

        function checkPaymentStatus() {
            const modal = document.getElementById('loadingModal');
            modal.style.display = 'flex';

            setTimeout(() => {
                modal.style.display = 'none';
                showToast('支付状态查询完成');
            }, 2000);
        }

        function showToast(message) {
            const existingToast = document.querySelector('.toast-message');
            if (existingToast) existingToast.remove();

            const toast = document.createElement('div');
            toast.className = 'toast-message fixed top-24 left-1/2 -translate-x-1/2 px-6 py-3 rounded-full z-[100] text-white text-sm font-medium whitespace-nowrap';
            toast.style.cssText = 'background: rgba(184, 146, 62, 0.95); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.2);';
            toast.textContent = message;
            document.body.appendChild(toast);

            gsap.fromTo(toast,
                { y: -30, opacity: 0 },
                { y: 0, opacity: 1, duration: 0.3, ease: "power2.out" }
            );

            setTimeout(() => {
                gsap.to(toast, {
                    y: -30,
                    opacity: 0,
                    duration: 0.3,
                    ease: "power2.in",
                    onComplete: () => toast.remove()
                });
            }, 2500);
        }
    </script>
</body>
</html>
