<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>支付成功</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
</head>
<body class="liandeng-body">
    <div class="ld-shell">
        <div class="ld-page" style="max-width: 780px;">
            <section class="ld-card" style="text-align:center; margin-top: 6vh;">
                <div class="ld-chip is-success" style="margin-bottom: 18px;">Payment Success</div>
                <h1 class="ld-card-title">支付成功</h1>
                <p class="ld-copy">本次支付已完成，以下为交易摘要。</p>

                <div class="ld-panel" style="margin-top: 28px; text-align:left;">
                    <div class="ld-list">
                        <div class="ld-list-item">
                            <div style="font-weight:700;">昵称</div>
                            <div th:text="${nickName}"></div>
                        </div>
                        <div class="ld-list-item">
                            <div style="font-weight:700;">支付金额</div>
                            <div>¥<span th:text="${money}"></span></div>
                        </div>
                        <div class="ld-list-item">
                            <div style="font-weight:700;">支付方式</div>
                            <div th:text="${payType}"></div>
                        </div>
                        <div class="ld-list-item">
                            <div style="font-weight:700;">留言</div>
                            <div th:text="${info}"></div>
                        </div>
                        <div class="ld-list-item">
                            <div style="font-weight:700;">支付时间</div>
                            <div th:text="${time}"></div>
                        </div>
                    </div>
                </div>

                <div style="margin-top: 24px;">
                    <a href="/starmc-pay.html" class="ld-button">返回支付页</a>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
