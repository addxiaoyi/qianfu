<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>操作失败</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
</head>
<body class="liandeng-body">
    <div class="ld-shell">
        <div class="ld-page" style="max-width: 720px;">
            <section class="ld-card" style="text-align:center; margin-top: 10vh;">
                <div class="ld-chip is-danger" style="margin-bottom: 18px;">Failed</div>
                <h1 class="ld-card-title">操作失败</h1>
                <p class="ld-copy">请求未成功完成。</p>
                <div style="margin-top: 20px;">
                    <img src="/assets/images/fail.png" width="56" alt="fail">
                </div>
                <p class="ld-copy" style="margin-top: 18px;"><span th:text="${errorMsg}"></span></p>
            </section>
        </div>
    </div>
</body>
</html>
