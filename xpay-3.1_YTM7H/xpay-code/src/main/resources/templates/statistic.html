<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>支付数据统计</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
</head>
<body class="liandeng-body">
    <div class="ld-shell">
        <div class="ld-page" style="max-width: 900px;">
            <section class="ld-card">
                <div style="margin-bottom: 20px;">
                    <div class="ld-chip" style="margin-bottom: 14px;">Statistics</div>
                    <h1 class="ld-card-title">支付数据统计</h1>
                </div>

                <div class="ld-grid" style="grid-template-columns: 1fr; gap: 14px;">
                    <label class="ld-field">
                        <span class="ld-label">时间选择</span>
                        <select id="type" class="ld-select" onchange="query()">
                            <option value="0">今日</option>
                            <option value="6">昨天</option>
                            <option value="1">本周</option>
                            <option value="2">本月</option>
                            <option value="3">本年</option>
                            <option value="4">上周</option>
                            <option value="5">上月</option>
                            <option value="-1">总额统计</option>
                        </select>
                    </label>

                    <div class="ld-grid" style="grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px;">
                        <label class="ld-field"><span class="ld-label">总金额</span><input type="text" id="amount" class="ld-input" readonly></label>
                        <label class="ld-field"><span class="ld-label">当面付</span><input type="text" id="dmf" class="ld-input" readonly></label>
                        <label class="ld-field"><span class="ld-label">微信官方</span><input type="text" id="weixin" class="ld-input" readonly></label>
                        <label class="ld-field"><span class="ld-label">支付宝</span><input type="text" id="alipay" class="ld-input" readonly></label>
                        <label class="ld-field"><span class="ld-label">微信</span><input type="text" id="wechat" class="ld-input" readonly></label>
                        <label class="ld-field"><span class="ld-label">QQ</span><input type="text" id="qq" class="ld-input" readonly></label>
                        <label class="ld-field"><span class="ld-label">云闪付</span><input type="text" id="union" class="ld-input" readonly></label>
                        <label class="ld-field"><span class="ld-label">扫码点单</span><input type="text" id="diandan" class="ld-input" readonly></label>
                    </div>

                    <div style="margin-top: 10px;">
                        <button type="button" class="ld-button" onclick="query()">统计查询</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script>
        function getUrlParam(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return unescape(r[2]);
            return null;
        }

        var myToken = getUrlParam('myToken');

        query();
        function query(){
            $.post('/pay/statistic', {
                type: $("#type").val(),
                myToken: myToken
            }, function (data) {
                if(data.success==true){
                    $("#amount").val(data.result.amount);
                    $("#dmf").val(data.result.dmf);
                    $("#weixin").val(data.result.weixin);
                    $("#alipay").val(data.result.alipay);
                    $("#wechat").val(data.result.wechat);
                    $("#qq").val(data.result.qq);
                    $("#union").val(data.result.union);
                    $("#diandan").val(data.result.diandan);
                } else {
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
