<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1, maximum-scale=1" />
    <title>XPay 审核通知</title>
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css" />
    <style type="text/css">
        body { margin: 0; padding: 0; background: #f5f1e8; color: #121212; font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
        table { border-collapse: collapse; border-spacing: 0; }
        img { border: 0; display: block; }
        a { color: #121212; text-decoration: none; }
        .shell { width: 100%; padding: 32px 12px; background: radial-gradient(circle at top, rgba(190,163,115,0.18), transparent 44%), #f5f1e8; }
        .card { width: 100%; max-width: 720px; background: #fffdf8; border: 1px solid #d7cfbf; border-radius: 32px; overflow: hidden; box-shadow: 0 22px 60px rgba(18, 18, 18, 0.08); }
        .hero { padding: 36px 42px 24px; background: linear-gradient(135deg, #f9f4ea 0%, #efe5d3 100%); border-bottom: 1px solid #e3d9c6; }
        .eyebrow { font-size: 12px; letter-spacing: 0.34em; text-transform: uppercase; color: #7b6f5e; }
        .title { padding-top: 16px; font-size: 34px; line-height: 1.15; font-weight: 700; letter-spacing: 0.04em; font-style: italic; }
        .subtitle { padding-top: 12px; font-size: 14px; line-height: 1.8; color: #544b40; }
        .section { padding: 28px 42px 0; }
        .section-title { font-size: 12px; letter-spacing: 0.3em; text-transform: uppercase; color: #8a7d6c; padding-bottom: 14px; }
        .panel { width: 100%; background: #fbf8f1; border: 1px solid #e6dccb; border-radius: 22px; overflow: hidden; }
        .row-label { width: 180px; padding: 16px 20px; font-size: 13px; font-weight: 700; color: #5f5448; border-bottom: 1px solid #ece3d4; }
        .row-value { padding: 16px 20px; font-size: 14px; color: #141414; border-bottom: 1px solid #ece3d4; }
        .last .row-label, .last .row-value { border-bottom: none; }
        .actions { padding: 28px 42px 8px; }
        .action { display: inline-block; margin: 0 12px 12px 0; padding: 14px 20px; border-radius: 999px; border: 1px solid #121212; font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; background: #121212; color: #f7f3ea !important; }
        .action.alt { background: transparent; color: #121212 !important; }
        .notes { padding: 18px 42px 12px; font-size: 13px; line-height: 1.9; color: #5f5448; }
        .footer { padding: 22px 42px 40px; font-size: 12px; line-height: 1.9; color: #756857; }
        @media only screen and (max-width: 640px) {
            .hero, .section, .actions, .notes, .footer { padding-left: 20px !important; padding-right: 20px !important; }
            .title { font-size: 28px !important; }
            .row-label, .row-value { display: block; width: auto !important; }
        }
    </style>
</head>
<body>
<table class="shell" width="100%" cellpadding="0" cellspacing="0" border="0">
    <tr>
        <td align="center">
            <table class="card" width="720" cellpadding="0" cellspacing="0" border="0">
                <tr>
                    <td class="hero">
                        <table width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td align="left" class="eyebrow">QianFu Liandeng / XPay</td>
                            </tr>
                            <tr>
                                <td class="title">支付审核通知</td>
                            </tr>
                            <tr>
                                <td class="subtitle">
                                    尊敬的管理员 Exrick，您收到了来自 <span th:text="${title}"></span> 的订单，请及时处理。
                                </td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td class="section">
                        <div class="section-title">Order Snapshot</div>
                        <table class="panel" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td class="row-label">用户昵称</td>
                                <td class="row-value"><span th:text="${nickName}"></span></td>
                            </tr>
                            <tr>
                                <td class="row-label">捐赠金额</td>
                                <td class="row-value">
                                    <span th:if="${payType} eq 'UnionPay'">原价：</span><span th:text="${money}"></span>
                                    <span th:if="${payType} eq 'UnionPay'"> 优惠价格：<span th:text="${money}-${payNum}*0.1"></span></span>
                                </td>
                            </tr>
                            <tr>
                                <td class="row-label">支付方式</td>
                                <td class="row-value"><span th:text="${payType}"></span></td>
                            </tr>
                            <tr>
                                <td class="row-label">购买数量</td>
                                <td class="row-value"><span th:text="${payNum}"></span></td>
                            </tr>
                            <tr>
                                <td class="row-label">手机号</td>
                                <td class="row-value"><span th:text="${mobile}"></span></td>
                            </tr>
                            <tr>
                                <td class="row-label">自定义参数</td>
                                <td class="row-value"><span th:text="${custom}"></span></td>
                            </tr>
                            <tr>
                                <td class="row-label">留言</td>
                                <td class="row-value"><span th:text="${info}"></span></td>
                            </tr>
                            <tr>
                                <td class="row-label">邮箱</td>
                                <td class="row-value"><span th:text="${email}"></span></td>
                            </tr>
                            <tr>
                                <td class="row-label">支付时间</td>
                                <td class="row-value"><span th:text="${time}"></span></td>
                            </tr>
                            <tr class="last">
                                <td class="row-label">设备信息</td>
                                <td class="row-value"><span th:text="${device}"></span></td>
                            </tr>
                        </table>
                    </td>
                </tr>
                <tr>
                    <td class="actions">
                        <a class="action" th:href="${passUrl}">审核通过</a>
                        <a class="action alt" th:href="${passUrl2}">通过并发小程序</a>
                        <a class="action alt" th:href="${passUrl3}">通过并发 X-Boot</a>
                        <a class="action alt" th:href="${backUrl}">驳回</a>
                        <a class="action alt" th:href="${passNotShowUrl}">通过但不展示</a>
                        <a class="action alt" th:href="${editUrl}">查看或编辑订单</a>
                        <a class="action alt" th:href="${delUrl}">删除支付数据</a>
                        <a class="action alt" th:href="${closeUrl}">开启或关闭系统</a>
                        <a class="action alt" th:href="${statistic}">数据统计</a>
                    </td>
                </tr>
                <tr>
                    <td class="notes">
                        该模板已切换为联灯风格邮件版式，保留原有审核入口与变量绑定，不改动业务回调和订单处理逻辑。
                    </td>
                </tr>
                <tr>
                    <td class="footer">
                        作者博客：<a href="http://blog.exrick.cn">blog.exrick.cn</a><br />
                        Github：<a href="https://github.com/Exrick">github.com/Exrick</a>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
