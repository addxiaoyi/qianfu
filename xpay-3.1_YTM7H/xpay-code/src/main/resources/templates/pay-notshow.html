<!doctype html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>支付成功但未展示</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
</head>
<body class="liandeng-body">
    <div class="ld-shell">
        <div class="ld-page" style="max-width: 760px;">
            <section class="ld-card" style="text-align:center; margin-top: 8vh;">
                <div class="ld-chip is-warning" style="margin-bottom: 18px;">Paid But Hidden</div>
                <h1 class="ld-card-title">支付成功</h1>
                <p class="ld-copy">订单已经支付，但由于金额过少或仅用于测试，系统不会将其加入捐赠展示列表。</p>

                <div class="ld-panel" style="text-align:left; margin-top: 24px;">
                    <div class="ld-list">
                        <div class="ld-list-item"><div style="font-weight:700;">昵称</div><div th:text="${nickName}"></div></div>
                        <div class="ld-list-item"><div style="font-weight:700;">支付金额</div><div th:text="${money}"></div></div>
                        <div class="ld-list-item"><div style="font-weight:700;">支付方式</div><div th:text="${payType}"></div></div>
                        <div class="ld-list-item"><div style="font-weight:700;">留言</div><div th:text="${info}"></div></div>
                        <div class="ld-list-item"><div style="font-weight:700;">创建时间</div><div th:text="${time}"></div></div>
                    </div>
                </div>
            </section>
        </div>
    </div>
</body>
</html>
