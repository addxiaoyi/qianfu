<!DOCTYPE html>
<html lang="zh-CN" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${tenant.displayName + ' 支付'}">XPay 支付</title>
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
    <style>
        .tenant-pay-wrap {
            min-height: 100vh;
            display: grid;
            place-items: center;
            padding: 24px;
        }
        .tenant-pay-card {
            width: min(520px, 100%);
        }
        .tenant-qr {
            width: min(280px, 100%);
            aspect-ratio: 1;
            display: grid;
            place-items: center;
            margin: 24px auto;
            border: 1px solid var(--ld-border);
            border-radius: 28px;
            background: #ffffff;
            overflow: hidden;
        }
        .tenant-qr img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            padding: 14px;
        }
        .tenant-row {
            display: flex;
            justify-content: space-between;
            gap: 16px;
            padding: 12px 0;
            border-top: 1px solid var(--ld-border);
        }
        .tenant-status {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-height: 34px;
            padding: 0 12px;
            border-radius: 999px;
            background: rgba(17, 17, 17, 0.06);
            color: var(--ld-text-soft);
            font-weight: 700;
        }
    </style>
</head>
<body class="liandeng-body">
<main class="tenant-pay-wrap">
    <section class="ld-card tenant-pay-card">
        <p class="ld-kicker" th:text="${tenant.tenantKey}">tenant</p>
        <h1 class="ld-card-title" th:text="${tenant.displayName}">XPay</h1>
        <p class="ld-copy">请核对金额后使用对应渠道扫码支付。</p>
        <div style="margin-top: 18px; padding: 16px; border: 1px solid var(--ld-border); border-radius: 22px; background: rgba(255,255,255,0.78);">
            <div class="ld-meta" style="margin-bottom: 8px;">付款备注</div>
            <div class="ld-mono" style="word-break: break-all;" th:text="${order.orderId}">order</div>
            <p class="ld-copy" style="margin: 10px 0 0;">个人码到账监听需要用备注匹配订单，请付款时填写此订单号。</p>
        </div>

        <div class="tenant-qr" th:if="${paymentQrContent != null}">
            <img th:src="${'https://api.qrserver.com/v1/create-qr-code/?size=280x280&data=' + T(java.net.URLEncoder).encode(#strings.toString(paymentQrContent), 'UTF-8')}" alt="官方支付二维码">
        </div>
        <div class="tenant-qr" th:if="${paymentQrContent == null && paymentMethod != null && paymentMethod.qrImagePath != null}">
            <img th:src="${paymentMethod.qrImagePath}" alt="支付二维码">
        </div>
        <div class="tenant-qr" th:if="${paymentQrContent == null && (paymentMethod == null || paymentMethod.qrImagePath == null)}">
            <p class="ld-copy" style="padding: 24px; text-align: center;">当前支付方式未配置二维码</p>
        </div>

        <div class="tenant-row">
            <span class="ld-meta">订单号</span>
            <span class="ld-mono" th:text="${order.orderId}">order</span>
        </div>
        <div class="tenant-row">
            <span class="ld-meta">金额</span>
            <strong th:text="${'¥' + order.amount}">¥0.00</strong>
        </div>
        <div class="tenant-row">
            <span class="ld-meta">支付方式</span>
            <span th:text="${paymentMethod != null ? paymentMethod.displayName : order.payType}">支付方式</span>
        </div>
        <div class="tenant-row" th:if="${paymentProviderMode == 'official'}">
            <span class="ld-meta">通道模式</span>
            <span th:text="${paymentProvider + ' 官方 API'}">official</span>
        </div>
        <div class="tenant-row">
            <span class="ld-meta">状态</span>
            <span class="tenant-status" th:text="${statusText}">待支付</span>
        </div>

        <button class="ld-button" type="button" onclick="window.location.reload()" style="width: 100%; margin-top: 20px;">刷新状态</button>
    </section>
</main>
</body>
</html>
