<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <title>删除支付订单</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="/assets/css/liandeng-theme.css">
</head>
<body class="liandeng-body">
    <div class="ld-shell">
        <div class="ld-page" style="max-width: 760px;">
            <section class="ld-card" style="text-align:center; margin-top: 8vh;">
                <div class="ld-chip is-danger" style="margin-bottom: 18px;">Delete Order</div>
                <h1 class="ld-card-title">删除支付订单</h1>
                <p class="ld-copy">确认后将删除当前支付数据。</p>
                <div style="margin-top: 24px;">
                    <button type="button" class="ld-button" onclick="confirmDelete()">确认删除</button>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/1.11.2/jquery.min.js"></script>
    <script>
        function getUrlParam(name) {
            var reg = new RegExp("(^|&)" + name + "=([^&]*)(&|$)");
            var r = window.location.search.substr(1).match(reg);
            if (r != null) return unescape(r[2]);
            return null;
        }

        var id = getUrlParam('id');
        var token = getUrlParam('token');

        function confirmDelete() {
            if (window.confirm('确认删除？')) {
                submit();
            }
        }

        function submit() {
            $.get('/pay/del', { id: id, token: token }, function (data) {
                if (data.success == true) {
                    window.location.href = "/success";
                } else {
                    alert(data.message);
                }
            });
        }
    </script>
</body>
</html>
