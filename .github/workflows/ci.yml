name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      skip_deploy:
        description: '跳过部署'
        required: false
        default: 'false'
        type: boolean

env:
  NODE_VERSION: '18'
  PNPM_VERSION: '8'

jobs:
  # ============================================
  # 1. 代码质量检查
  # ============================================
  lint:
    name: 代码质量检查
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 ESLint
        run: pnpm lint
        continue-on-error: true

      - name: 运行 Prettier 检查
        run: pnpm lint:prettier
        continue-on-error: true

      - name: 运行类型检查
        run: pnpm typecheck

  # ============================================
  # 1.1 Mutation Coverage (可选)
  # ============================================
  mutation-coverage:
    name: Mutation Coverage
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 Mutation Coverage
        run: pnpm test:mutation:ci
        continue-on-error: true
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}

      - name: 上传 Mutation 报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: mutation-report
          path: coverage/mutation/
          retention-days: 30

  # ============================================
  # 2. 单元测试
  # ============================================
  unit-test:
    name: 单元测试
    runs-on: ubuntu-latest
    needs: [lint, mutation-coverage]
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行单元测试
        run: pnpm test:unit --coverage

      - name: 上传覆盖率报告
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: 上传测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: unit-test-report
          path: coverage/test-report.html
          retention-days: 7

  # ============================================
  # 3. 集成测试
  # ============================================
  integration-test:
    name: 集成测试
    runs-on: ubuntu-latest
    needs: unit-test
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行集成测试
        run: pnpm test:integration --coverage
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/test
          REDIS_URL: redis://localhost:6379
          SKIP_DB: 'false'

      - name: 上传测试报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: integration-test-report
          path: coverage/test-report.html
          retention-days: 7

  # ============================================
  # 4. E2E 测试
  # ============================================
  e2e-test:
    name: E2E 测试
    runs-on: ubuntu-latest
    needs: integration-test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install --with-deps

      - name: 构建应用
        run: pnpm build

      - name: 启动服务
        run: pnpm start &
        env:
          NODE_ENV: test
          PORT: 3000

      - name: 等待服务启动
        run: sleep 10

      - name: 运行 E2E 测试
        run: pnpm test:e2e
        env:
          BASE_URL: http://localhost:3000
          CI: true

      - name: 上传 Playwright 报告
        uses: actions/upload-artifact@v3
        if: always()
        with:
          name: playwright-report
          path: |
            coverage/playwright-report
            coverage/playwright-results
          retention-days: 7

      - name: 上传失败截图
        uses: actions/upload-artifact@v3
        if: failure()
        with:
          name: playwright-screenshots
          path: coverage/playwright-results/**/failure*.png
          retention-days: 30

  # ============================================
  # 5. 安全扫描
  # ============================================
  security:
    name: 安全扫描
    runs-on: ubuntu-latest
    needs: e2e-test
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 运行 npm audit
        run: pnpm audit --audit-level=high
        continue-on-error: true

      - name: 运行 Snyk 漏洞扫描
        uses: snyk/actions/node@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true

  # ============================================
  # 6. 构建和部署准备
  # ============================================
  build:
    name: 构建
    runs-on: ubuntu-latest
    needs: [security]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'pnpm'

      - name: 安装 pnpm
        uses: pnpm/action-setup@v2
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 构建应用
        run: pnpm build

      - name: 上传构建产物
        uses: actions/upload-artifact@v3
        with:
          name: build-artifact
          path: |
            dist/
            .env.production
          retention-days: 1

  # ============================================
  # 7. 部署 (可选)
  # ============================================
  deploy:
    name: 部署
    runs-on: ubuntu-latest
    needs: build
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      github.event.inputs.skip_deploy != 'true'
    environment:
      name: production
      url: https://qianfu.example.com
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v3
        with:
          name: build-artifact

      - name: 部署到服务器
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_KEY }}
          script: |
            cd /var/www/qianfu
            docker-compose down
            docker-compose up -d
            docker system prune -f

      - name: 部署通知
        if: always()
        run: |
          echo "部署完成: ${{ job.status }}"
