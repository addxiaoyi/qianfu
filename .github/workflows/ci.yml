name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: qianfu_test
          POSTGRES_USER: qianfu
          POSTGRES_PASSWORD: qianfu_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U qianfu -d qianfu_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://qianfu:qianfu_test@127.0.0.1:5432/qianfu_test?schema=public
      REDIS_URL: redis://127.0.0.1:6379
      JWT_SECRET: ci-only-jwt-secret-at-least-32-characters
      SESSION_SECRET: ci-only-session-secret-at-least-32-characters
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            qianfu-liandeng/package-lock.json
            services/user-service/package-lock.json
      - name: Install backend dependencies
        run: npm ci
      - name: Install frontend dependencies
        run: npm ci --prefix qianfu-liandeng
      - name: Install user service dependencies
        run: npm ci --prefix services/user-service
      - name: Validate
        run: npm run validate
      - name: Build frontend release
        run: npm run build
      - name: Build server release
        run: npm run server:build
      - name: Build user service
        run: npm run build:user-service
      - name: Full coverage
        run: npm run test:coverage:full
