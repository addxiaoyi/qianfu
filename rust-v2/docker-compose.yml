services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: qianfu
      POSTGRES_USER: qianfu
      POSTGRES_PASSWORD: ${QF_POSTGRES_PASSWORD:?set QF_POSTGRES_PASSWORD}
    volumes:
      - qianfu-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U qianfu -d qianfu"]
      interval: 5s
      timeout: 3s
      retries: 12
    init: true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
      target: api
    environment:
      QF_DATABASE_URL: postgres://qianfu:${QF_POSTGRES_PASSWORD}@postgres:5432/qianfu
      QF_SESSION_SECRET: ${QF_SESSION_SECRET:?set QF_SESSION_SECRET}
      QF_COOKIE_SECURE: ${QF_COOKIE_SECURE:-true}
      QF_ALLOWED_ORIGINS: ${QF_ALLOWED_ORIGINS:-}
      QF_METRICS_TOKEN: ${QF_METRICS_TOKEN:?set QF_METRICS_TOKEN}
      QF_GITHUB_CLIENT_ID: ${QF_GITHUB_CLIENT_ID:-}
      QF_GITHUB_CLIENT_SECRET: ${QF_GITHUB_CLIENT_SECRET:-}
      QF_GITHUB_REDIRECT_URI: ${QF_GITHUB_REDIRECT_URI:-}
      QF_FRONTEND_URL: ${QF_FRONTEND_URL:-}
      QF_API_ADDR: 0.0.0.0:3100
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "3100:3100"
    init: true
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 256
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://127.0.0.1:3100/api/v2/ready"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s

  worker:
    build:
      context: .
      target: worker
    environment:
      QF_DATABASE_URL: postgres://qianfu:${QF_POSTGRES_PASSWORD}@postgres:5432/qianfu
      QF_SESSION_SECRET: ${QF_SESSION_SECRET:?set QF_SESSION_SECRET}
      QF_SMTP_HOST: ${QF_SMTP_HOST:-}
      QF_SMTP_PORT: ${QF_SMTP_PORT:-587}
      QF_SMTP_USERNAME: ${QF_SMTP_USERNAME:-}
      QF_SMTP_PASSWORD: ${QF_SMTP_PASSWORD:-}
      QF_SMTP_FROM: ${QF_SMTP_FROM:-}
      QF_CLOUDFLARE_API_TOKEN: ${QF_CLOUDFLARE_API_TOKEN:-}
      QF_CLOUDFLARE_ZONE_ID: ${QF_CLOUDFLARE_ZONE_ID:-}
      QF_ALIYUN_ACCESS_KEY_ID: ${QF_ALIYUN_ACCESS_KEY_ID:-}
      QF_ALIYUN_ACCESS_KEY_SECRET: ${QF_ALIYUN_ACCESS_KEY_SECRET:-}
      QF_ALIYUN_DNS_ZONE: ${QF_ALIYUN_DNS_ZONE:-}
      QF_ALIYUN_DNS_ENDPOINT: ${QF_ALIYUN_DNS_ENDPOINT:-}
      QF_R2_ENDPOINT: ${QF_R2_ENDPOINT:-}
      QF_R2_BUCKET: ${QF_R2_BUCKET:-}
      QF_R2_PUBLIC_URL: ${QF_R2_PUBLIC_URL:-}
      QF_R2_ACCESS_KEY_ID: ${QF_R2_ACCESS_KEY_ID:-}
      QF_R2_SECRET_ACCESS_KEY: ${QF_R2_SECRET_ACCESS_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
    init: true
    read_only: true
    cap_drop:
      - ALL
    pids_limit: 128
    security_opt:
      - no-new-privileges:true

volumes:
  qianfu-postgres:
