[workspace]
resolver = "2"
members = [
  "apps/api",
  "apps/worker",
  "crates/auth",
  "crates/core",
  "crates/providers",
  "crates/storage",
]

[workspace.package]
edition = "2024"
version = "0.1.0"
license = "UNLICENSED"

[workspace.dependencies]
argon2 = "0.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde", "clock"] }
email_address = "0.2"
getrandom = "0.3"
hmac = "0.12"
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-native-tls"] }
native-tls = "0.2"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
sha1 = "0.10"
sha2 = "0.10"
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["chrono", "derive", "macros", "migrate", "postgres", "runtime-tokio-rustls", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-native-tls = "0.3"
tower = "0.5"
uuid = { version = "1", features = ["serde", "v4"] }
url = "2"
