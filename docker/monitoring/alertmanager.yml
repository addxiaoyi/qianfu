global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'email'
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
      continue: true
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
  - name: 'email'
    email_configs:
      - to: 'admin@qianfu.example.com'
        from: 'alertmanager@qianfu.example.com'
        smarthost: 'smtp.example.com:587'
        auth_username: 'alertmanager'
        auth_password: 'password'

  - name: 'critical-alerts'
    email_configs:
      - to: 'urgent@qianfu.example.com'
        headers:
          subject: '🚨 [CRITICAL] 千服告警'
    webhook_configs:
      - url: 'http://host.docker.internal:3050/api/webhooks/alert'

  - name: 'warning-alerts'
    email_configs:
      - to: 'warnings@qianfu.example.com'
        headers:
          subject: '⚠️ [WARNING] 千服告警'

inhibit_rules:
  - source_match:
      severity: 'critical'
    target_match:
      severity: 'warning'
    equal: ['alertname', 'instance']
