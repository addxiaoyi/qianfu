global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # Main API Server
  - job_name: 'qianfu-api'
    static_configs:
      - targets: ['host.docker.internal:3050']
    metrics_path: '/metrics'
    scrape_interval: 10s

  # User Service
  - job_name: 'qianfu-user-service'
    static_configs:
      - targets: ['host.docker.internal:3070']
    metrics_path: '/health/metrics'
    scrape_interval: 10s

  # Server Service
  - job_name: 'qianfu-server-service'
    static_configs:
      - targets: ['host.docker.internal:3071']
    metrics_path: '/health/metrics'
    scrape_interval: 10s

  # Payment Service
  - job_name: 'qianfu-payment-service'
    static_configs:
      - targets: ['host.docker.internal:3072']
    metrics_path: '/health/metrics'
    scrape_interval: 10s

  # Event Bus
  - job_name: 'qianfu-event-bus'
    static_configs:
      - targets: ['host.docker.internal:3060']
    metrics_path: '/health/metrics'
    scrape_interval: 10s

  # Redis (if using redis_exporter)
  # - job_name: 'redis'
  #   static_configs:
  #     - targets: ['host.docker.internal:6379']
