<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#8b5cf6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" rx="128" fill="url(#bgGradient)"/>

  <!-- 外圈 -->
  <circle cx="256" cy="256" r="200" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="8"/>

  <!-- 内圈 -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="4"/>

  <!-- 中心方块（Minecraft 风格） -->
  <g transform="translate(256, 256)" filter="url(#shadow)">
    <!-- 主体方块 -->
    <rect x="-60" y="-60" width="120" height="120" fill="#fbbf24" rx="8"/>

    <!-- 方块高光 -->
    <rect x="-50" y="-50" width="40" height="40" fill="#fcd34d" rx="4"/>
    <rect x="-10" y="-50" width="50" height="20" fill="#fcd34d" rx="2"/>

    <!-- 方块阴影 -->
    <rect x="-50" y="10" width="100" height="40" fill="#d97706" rx="4"/>
    <rect x="10" y="-50" width="40" height="100" fill="#d97706" rx="4"/>

    <!-- 中心装饰 -->
    <circle cx="0" cy="0" r="20" fill="#6366f1"/>
    <circle cx="0" cy="0" r="12" fill="#8b5cf6"/>
    <circle cx="0" cy="0" r="6" fill="#ffffff"/>
  </g>

  <!-- 环绕的小方块 -->
  <g fill="#ffffff" opacity="0.6">
    <rect x="120" y="120" width="24" height="24" rx="4"/>
    <rect x="368" y="120" width="24" height="24" rx="4"/>
    <rect x="120" y="368" width="24" height="24" rx="4"/>
    <rect x="368" y="368" width="24" height="24" rx="4"/>
  </g>

  <!-- 连接线 -->
  <g stroke="rgba(255,255,255,0.2)" stroke-width="2" fill="none">
    <line x1="144" y1="132" x2="232" y2="196"/>
    <line x1="368" y1="132" x2="280" y2="196"/>
    <line x1="144" y1="380" x2="232" y2="316"/>
    <line x1="368" y1="380" x2="280" y2="316"/>
  </g>
</svg>
